<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hyzen Downloads — Verified UI Preview</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#101012;color:#fff}*{box-sizing:border-box}
body{margin:0;padding:22px 16px 40px}main{max-width:470px;margin:auto}h1{font-size:21px;letter-spacing:-.03em}p{font-size:13px;line-height:1.5;color:#bbb}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 15px}button{border:1px solid #666;border-radius:999px;background:#27272b;color:white;padding:10px 14px;min-height:44px;font-size:14px;font-weight:650}
button[aria-pressed=true]{color:#111;background:white;border-color:white}img{width:100%;height:auto;display:block;border-radius:20px;box-shadow:0 8px 30px #0007}
a{display:block;text-align:center;color:#ddd;margin:20px auto;font-size:14px}
</style></head>
<body><main><h1>PHARM D WITH HYZEN — Downloads</h1>
<p>These are real Flutter browser screenshots with sample data. This lightweight review works even if the interactive Flutter preview stays cached on your phone.</p>
<div class="controls"><button id="dark">Dark</button><button id="light">Light</button><button id="empty">No downloads</button><button id="files">With files</button></div>
<img id="screen" alt="Downloads screenshot showing the unique panda in the Offline Library card">
<a id="interactive">Open interactive Flutter preview</a></main>
<script>
const qs=new URLSearchParams(location.search),state={theme:qs.get('theme')==='light'?'light':'dark',mode:qs.get('mode')==='files'?'files':'empty'};
function render(){
 document.getElementById('screen').src=state.theme+'-downloads'+(state.mode==='empty'?'-empty':'')+'.png';
 for(const id of ['dark','light','empty','files'])document.getElementById(id).setAttribute('aria-pressed',String(id===state.theme||id===state.mode));
 document.getElementById('interactive').href='../ui-review/?theme='+state.theme+'&scenario='+(state.mode==='empty'?'empty':'populated')+'#/downloads';
}
for(const id of ['dark','light','empty','files'])document.getElementById(id).onclick=()=>{if(id==='dark'||id==='light')state.theme=id;else state.mode=id;render();};render();
</script></body></html>
