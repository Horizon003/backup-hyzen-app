<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hyzen Downloads — UI Preview</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:white;background:#111}*{box-sizing:border-box}body{margin:0;padding:20px 16px 45px}main{max-width:470px;margin:auto}
h1{font-size:21px}p{font-size:13px;line-height:1.5;color:#ccc}nav{display:flex;gap:8px;margin:20px 0}button{min-height:44px;padding:10px 20px;border:1px solid #555;border-radius:24px;background:#303034;color:white;font-size:14px;font-weight:650}button[aria-pressed=true]{color:#111;background:white}
img{width:100%;display:block;border-radius:20px;box-shadow:0 9px 30px #0008}a{display:block;margin:20px 0;text-align:center;color:#ddd;font-size:14px}
</style></head><body><main><h1>PHARM D WITH HYZEN — Downloads</h1><p>Verified screenshots from the Flutter browser build, using sample records. This lightweight view works even if an older Flutter preview is cached on your phone.</p>
<nav><button id="dark" aria-pressed="true">Dark mode</button><button id="light" aria-pressed="false">Light mode</button></nav>
<img id="screen" src="dark-downloads.png" alt="Downloads screen showing the new waving panda in the Offline Library banner">
<a id="interactive" href="../ui-review/?theme=dark#/downloads">Open interactive Flutter preview</a>
<a id="empty" href="../ui-review/?theme=dark&scenario=empty#/downloads">See interactive empty Downloads state</a></main>
<script>
const state={theme:new URLSearchParams(location.search).get('theme')==='light'?'light':'dark'};
function render(){document.getElementById('screen').src=state.theme+'-downloads.png';for(const theme of ['dark','light'])document.getElementById(theme).setAttribute('aria-pressed',String(theme===state.theme));document.getElementById('interactive').href='../ui-review/?theme='+state.theme+'#/downloads';document.getElementById('empty').href='../ui-review/?theme='+state.theme+'&scenario=empty#/downloads'}
for(const theme of ['dark','light'])document.getElementById(theme).onclick=()=>{state.theme=theme;render()};render();
</script></body></html>
