name: Build PHARM D WITH HYZEN 1.5.3 Universal APK

on:
  workflow_dispatch:
  push:
    branches:
      - work/professional-redesign-1.5
    paths:
      - 'hyzen_flutter/**'
      - '.github/workflows/android-apk-15.yml'

permissions:
  contents: read

concurrency:
  group: hyzen-15-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pdfrx ships large native binaries for every ABI. Remove unused
      # preinstalled SDK images before Gradle expands those libraries.
      - name: Free runner disk without removing Android build tools
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android/sdk/system-images/* || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk-bundle || true
          # Unused preinstalled toolchains consume multiple GB on hosted runners.
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc /usr/share/swift || true
          sudo apt-get clean
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: hyzen_flutter/android/*.gradle*

      - name: Cache Android native toolchains
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/25.1.8937393
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-native-${{ runner.os }}-ndk25-cmake322-${{ hashFiles('hyzen_flutter/pubspec.lock', 'hyzen_flutter/android/**/build.gradle*') }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Restore owner signing key
        working-directory: hyzen_flutter
        env:
          KEYSTORE_BASE64: ${{ secrets.HYZEN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HYZEN_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.HYZEN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HYZEN_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          mkdir -p android/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/signing/hyzen-release.jks
          chmod 600 android/signing/hyzen-release.jks
          printf 'storeFile=signing/hyzen-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          chmod 600 android/key.properties

      - run: flutter pub get
        working-directory: hyzen_flutter
      - run: flutter analyze --no-pub
        working-directory: hyzen_flutter
      - run: flutter test --no-pub --reporter expanded
        working-directory: hyzen_flutter
      # One APK containing Flutter libraries for ARM32, ARM64 and x86_64.
      # Never add --split-per-abi to this universal release workflow.
      - run: flutter build apk --release --no-pub --target-platform android-arm,android-arm64,android-x64
        working-directory: hyzen_flutter

      - name: Verify APK metadata and checksum
        working-directory: hyzen_flutter
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          # Fail early if an architecture is missing from the universal APK.
          for abi in armeabi-v7a arm64-v8a x86_64; do
            unzip -Z1 "$apk" | grep -Fxq "lib/$abi/libflutter.so"
          done
          sha256sum "$apk" > "$apk.sha256"
          grep -q 'version: 1.5.3+12' pubspec.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: PharmD_With_Hyzen_1.5.3_Universal_signed
          path: |
            hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk
            hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PharmD_With_Hyzen_1.5.3_Universal_signed
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r apk/app-release.apk
            adb shell monkey -p com.hyzen.pharmd -c android.intent.category.LAUNCHER 1
            sleep 8
            adb logcat -d > launch-logcat.txt
            adb shell pidof com.hyzen.pharmd
            ! grep -qE 'FATAL EXCEPTION|Process: com.hyzen.pharmd.*killed|signal 11' launch-logcat.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hyzen_1.5.3_install_smoke_logs
          path: launch-logcat.txt
          if-no-files-found: ignore
