name: OneSignal and professional rank verification
on:
  push:
    branches: [feat/onesignal-global-professional]
  pull_request:
    branches: [main]
    paths: ['push-worker/**', 'hyzen_flutter/**']
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ONESIGNAL_DISABLE_LOCATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - run: flutter analyze --no-pub
        working-directory: hyzen_flutter
      - run: flutter test --no-pub -r expanded
        working-directory: hyzen_flutter
      - run: flutter build web --release --no-pub --base-href /pharm-d-with-hyzen/
        working-directory: hyzen_flutter
      - run: flutter build apk --debug --no-pub
        working-directory: hyzen_flutter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onesignal-review-builds
          path: |
            hyzen_flutter/build/web
            hyzen_flutter/build/app/outputs/flutter-apk/app-debug.apk
  sender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: push-worker
      - run: npm test
        working-directory: push-worker
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: push-worker
      - run: node --test backend/functions/scoring.test.js
