name: OneSignal and professional rank verification
on:
  push:
    branches: [feat/onesignal-global-professional]
  pull_request:
    branches: [main]
    paths: ['push-worker/**', 'hyzen_flutter/**']
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ONESIGNAL_DISABLE_LOCATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - run: flutter analyze --no-pub
        working-directory: hyzen_flutter
      - run: flutter test --no-pub -r expanded
        working-directory: hyzen_flutter
      - run: flutter build web --release --no-pub --base-href /pharm-d-with-hyzen/
        working-directory: hyzen_flutter
      - run: flutter build apk --debug --no-pub
        working-directory: hyzen_flutter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onesignal-review-builds
          path: |
            hyzen_flutter/build/web
            hyzen_flutter/build/app/outputs/flutter-apk/app-debug.apk
  sender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: push-worker
      - run: npm test
        working-directory: push-worker
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: push-worker
      - run: node --test backend/functions/scoring.test.js
  owner-signed-apk:
    if: github.event_name == 'push'
    needs: [flutter, sender]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ONESIGNAL_DISABLE_LOCATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true
      - name: Restore existing owner signing only
        working-directory: hyzen_flutter
        env:
          KEYSTORE_BASE64: ${{ secrets.HYZEN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HYZEN_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.HYZEN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HYZEN_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          mkdir -p android/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/signing/hyzen-release.jks
          printf 'storeFile=signing/hyzen-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          chmod 600 android/signing/hyzen-release.jks android/key.properties
      - run: flutter pub get
        working-directory: hyzen_flutter
      - run: flutter build apk --release --no-pub
        working-directory: hyzen_flutter
      - name: Verify existing owner certificate
        working-directory: hyzen_flutter
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > signing-report.txt
          grep -qi '3fd902d131ae56d8de4792c9f5953759e2b375e32bcad8f57f7ef5c0ab887f83' signing-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hyzen-onesignal-owner-signed-apk
          path: |
            hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk
            hyzen_flutter/signing-report.txt
