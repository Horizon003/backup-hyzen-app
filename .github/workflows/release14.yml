name: Hyzen 1.4.3 immersive reader and document scanner build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['updates_1_4_0.json', 'updates_1_4_1.json', 'updates_1_4_2.json', 'updates_1_4_3.json', '.github/workflows/release14.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hyzen14
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore complete project and changes
        run: |
          unzip -q PharmD_With_Hyzen_Source_1.3.3.zip
          cp -a lib/. hyzen_flutter/lib/
          cp -a android/. hyzen_flutter/android/
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('hyzen_flutter').resolve()
          changes=json.loads(Path('updates_1_4_0.json').read_text())
          changes.update(json.loads(Path('updates_1_4_1.json').read_text()))
          changes.update(json.loads(Path('updates_1_4_2.json').read_text()))
          changes.update(json.loads(Path('updates_1_4_3.json').read_text()))
          for rel, text in changes.items():
              target=(root/rel).resolve()
              if not target.is_relative_to(root) or rel.startswith('android/signing') or rel=='android/key.properties':
                  raise ValueError('Invalid patch target')
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(text)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        id: android_native_cache
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: hyzen-android-native-sdk-v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - name: Format and apply standard lint fixes
        working-directory: hyzen_flutter
        run: |
          dart format lib test
          dart fix --apply
          dart fix --apply --code=curly_braces_in_flow_control_structures
          dart format lib test
      - run: flutter analyze --no-pub
        working-directory: hyzen_flutter
      - run: flutter test --no-pub --reporter expanded --dart-define=HYZEN_CAPTURE_QA=true --update-goldens
        working-directory: hyzen_flutter
      - uses: actions/upload-artifact@v4
        with:
          name: Hyzen_1.4.3_UI_QA
          path: hyzen_flutter/qa/*.png
          if-no-files-found: error
      - name: Benchmark original Drive file IDs
        working-directory: hyzen_flutter
        run: python3 qa/drive_benchmark.py --output qa/drive_benchmark_results.json
      - name: Build mobile browser preview
        working-directory: hyzen_flutter
        run: flutter build web --release --no-pub --base-href "/pharm-d-with-hyzen/"
      - name: Package updated source without signing credentials
        run: |
          cd hyzen_flutter
          zip -qr ../PharmD_With_Hyzen_Source_1.4.3.zip . -x '.dart_tool/*' 'build/*' 'android/.gradle/*' 'android/.kotlin/*' 'android/local.properties' 'android/key.properties' 'android/signing/*' 'android/test-signing/*' '*.jks' '*.keystore' '.flutter-plugins*'
      - name: Restore owner signing key
        working-directory: hyzen_flutter
        env:
          KEYSTORE_BASE64: ${{ secrets.HYZEN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HYZEN_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.HYZEN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HYZEN_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p android/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/signing/hyzen-release.jks
          printf 'storeFile=signing/hyzen-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          chmod 600 android/key.properties android/signing/hyzen-release.jks
      - name: Configure the signed Android release
        working-directory: hyzen_flutter
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'^version:\s*(\S+)', Path('pubspec.yaml').read_text(), re.M).group(1)
          name, code = version.split('+')
          sdk = os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT']
          flutter = os.environ['FLUTTER_ROOT']
          Path('android/local.properties').write_text(f'sdk.dir={sdk}\nflutter.sdk={flutter}\nflutter.versionName={name}\nflutter.versionCode={code}\n')
          PY
      - name: Build native PDF instrumentation tests
        working-directory: hyzen_flutter/android
        run: |
          ./gradlew :app:assembleReleaseAndroidTest :app:assembleRelease -Ptarget-platform=android-arm,android-arm64,android-x64 -Ptarget=lib/main.dart -Ptree-shake-icons=true
          mkdir -p ../build/app/outputs/flutter-apk
          cp ../build/app/outputs/apk/release/app-release.apk ../build/app/outputs/flutter-apk/app-release.apk
      - name: Verify original release signing identity
        working-directory: hyzen_flutter
        run: |
          signer=$(rg --files "$ANDROID_HOME/build-tools" | rg '/apksigner for subsequent builds
        if: always() && steps.android_native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: hyzen-android-native-sdk-v1
      - uses: actions/upload-artifact@v4
        with:
          name: Hyzen_1.4.3_signed_and_source
          path: |
            hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk
            hyzen_flutter/build/app/outputs/apk/androidTest/release/*.apk
            PharmD_With_Hyzen_Source_1.4.3.zip
            hyzen_flutter/qa/drive_benchmark_results.json
            hyzen_flutter/qa/signing-report.txt
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hyzen_flutter/build/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Hyzen_1.4.3_diagnostics
          path: |
            hyzen_flutter/qa/drive_benchmark_results.json
            hyzen_flutter/pubspec.lock

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hyzen_1.4.3_signed_and_source
          path: artifact
      - uses: actions/checkout@v4
      - name: Restore reader UI verification script
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('reader_intent_smoke.py').write_text(json.loads(Path('updates_1_4_3.json').read_text())['qa/reader_intent_smoke.py'])
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r artifact/hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk
            adb shell monkey -p com.hyzen.pharmd -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.hyzen.pharmd
            adb logcat -d > launch14-logcat.txt
            adb install -r -t artifact/hyzen_flutter/build/app/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w com.hyzen.pharmd.test/androidx.test.runner.AndroidJUnitRunner | tee native-pdf-tests.txt
            adb logcat -d > native-pdf-logcat.txt
            python3 -c "from pathlib import Path; s=Path('native-pdf-tests.txt').read_text(); assert 'OK (' in s and 'FAILURES' not in s, s"
            adb shell am force-stop com.hyzen.pharmd
            adb shell am start -W -n com.hyzen.pharmd/.MainActivity -a android.intent.action.VIEW -t application/pdf -d content://com.hyzen.pharmd.updates/shares/external_fixture.pdf
            sleep 10
            adb shell uiautomator dump /sdcard/hyzen-external-cold.xml
            adb pull /sdcard/hyzen-external-cold.xml external-cold.xml
            adb shell screencap -p /sdcard/hyzen-external-cold.png
            adb pull /sdcard/hyzen-external-cold.png external-cold.png
            adb shell am start -W -n com.hyzen.pharmd/.MainActivity -a android.intent.action.VIEW -t application/pdf -d content://com.hyzen.pharmd.updates/shares/external_fixture.pdf
            sleep 5
            adb shell uiautomator dump /sdcard/hyzen-external-warm.xml
            adb pull /sdcard/hyzen-external-warm.xml external-warm.xml
            adb logcat -d > external-intent-logcat.txt
            python3 -c "from pathlib import Path; files=['external-cold.xml','external-warm.xml']; [(lambda s: (print(f),exec(\"assert 'external_fixture.pdf' in s and 'Page unavailable' not in s and 'This page could not be found' not in s\")))(Path(f).read_text()) for f in files]"
            python3 reader_intent_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hyzen_1.4.3_install_logs
          path: |
            launch14-logcat.txt
            native-pdf-tests.txt
            native-pdf-logcat.txt
            external-cold.xml
            external-warm.xml
            external-cold.png
            external-intent-logcat.txt
            reader-*.xml
            reader-hidden.png
            reader-ui-result.txt
 | sort -V | tail -1)
          "$signer" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > qa/signing-report.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('qa/signing-report.txt').read_text().lower()
          assert '3fd902d131ae56d8de4792c9f5953759e2b375e32bcad8f57f7ef5c0ab887f83' in s, 'Unexpected signing certificate'
          print('Original owner release certificate verified')
          PY
      - name: Retain installed Android native SDK for subsequent builds
        if: always() && steps.android_native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: hyzen-android-native-sdk-v1
      - uses: actions/upload-artifact@v4
        with:
          name: Hyzen_1.4.3_signed_and_source
          path: |
            hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk
            hyzen_flutter/build/app/outputs/apk/androidTest/release/*.apk
            PharmD_With_Hyzen_Source_1.4.3.zip
            hyzen_flutter/qa/drive_benchmark_results.json
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hyzen_flutter/build/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Hyzen_1.4.3_diagnostics
          path: |
            hyzen_flutter/qa/drive_benchmark_results.json
            hyzen_flutter/pubspec.lock

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hyzen_1.4.3_signed_and_source
          path: artifact
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r artifact/hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk
            adb shell monkey -p com.hyzen.pharmd -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.hyzen.pharmd
            adb logcat -d > launch14-logcat.txt
            adb install -r -t artifact/hyzen_flutter/build/app/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w com.hyzen.pharmd.test/androidx.test.runner.AndroidJUnitRunner | tee native-pdf-tests.txt
            adb logcat -d > native-pdf-logcat.txt
            python3 -c "from pathlib import Path; s=Path('native-pdf-tests.txt').read_text(); assert 'OK (' in s and 'FAILURES' not in s, s"
            adb shell am force-stop com.hyzen.pharmd
            adb shell am start -W -n com.hyzen.pharmd/.MainActivity -a android.intent.action.VIEW -t application/pdf -d content://com.hyzen.pharmd.updates/shares/external_fixture.pdf
            sleep 10
            adb shell uiautomator dump /sdcard/hyzen-external-cold.xml
            adb pull /sdcard/hyzen-external-cold.xml external-cold.xml
            adb shell screencap -p /sdcard/hyzen-external-cold.png
            adb pull /sdcard/hyzen-external-cold.png external-cold.png
            adb shell am start -W -n com.hyzen.pharmd/.MainActivity -a android.intent.action.VIEW -t application/pdf -d content://com.hyzen.pharmd.updates/shares/external_fixture.pdf
            sleep 5
            adb shell uiautomator dump /sdcard/hyzen-external-warm.xml
            adb pull /sdcard/hyzen-external-warm.xml external-warm.xml
            adb logcat -d > external-intent-logcat.txt
            python3 -c "from pathlib import Path; files=['external-cold.xml','external-warm.xml']; [(lambda s: (print(f),exec(\"assert 'external_fixture.pdf' in s and 'Page unavailable' not in s and 'This page could not be found' not in s\")))(Path(f).read_text()) for f in files]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hyzen_1.4.3_install_logs
          path: |
            launch14-logcat.txt
            native-pdf-tests.txt
            native-pdf-logcat.txt
            external-cold.xml
            external-warm.xml
            external-cold.png
            external-intent-logcat.txt
