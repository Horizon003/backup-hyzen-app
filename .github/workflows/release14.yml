name: Hyzen 1.4 build and preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['updates_1_4_0.json', '.github/workflows/release14.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hyzen14
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore complete project and changes
        run: |
          unzip -q PharmD_With_Hyzen_Source_1.3.3.zip
          cp -a lib/. hyzen_flutter/lib/
          cp -a android/. hyzen_flutter/android/
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('hyzen_flutter').resolve()
          for rel, text in json.loads(Path('updates_1_4_0.json').read_text()).items():
              target=(root/rel).resolve()
              if not target.is_relative_to(root) or rel.startswith('android/signing') or rel=='android/key.properties':
                  raise ValueError('Invalid patch target')
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(text)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - name: Format and apply standard lint fixes
        working-directory: hyzen_flutter
        run: |
          dart format lib test
          dart fix --apply
          dart fix --apply --code=curly_braces_in_flow_control_structures
          dart format lib test
      - run: flutter analyze --no-pub
        working-directory: hyzen_flutter
      - run: flutter test --no-pub --reporter expanded --dart-define=HYZEN_CAPTURE_QA=true --update-goldens
        working-directory: hyzen_flutter
      - uses: actions/upload-artifact@v4
        with:
          name: Hyzen_1.4_UI_QA
          path: hyzen_flutter/qa/*.png
          if-no-files-found: error
      - name: Benchmark original Drive file IDs
        working-directory: hyzen_flutter
        run: python3 qa/drive_benchmark.py --output qa/drive_benchmark_results.json
      - name: Build mobile browser preview
        working-directory: hyzen_flutter
        run: flutter build web --release --no-pub --base-href "/pharm-d-with-hyzen/"
      - name: Package updated source without signing credentials
        run: |
          cd hyzen_flutter
          zip -qr ../PharmD_With_Hyzen_Source_1.4.0.zip . -x '.dart_tool/*' 'build/*' 'android/.gradle/*' 'android/.kotlin/*' 'android/local.properties' 'android/key.properties' 'android/signing/*' 'android/test-signing/*' '*.jks' '*.keystore' '.flutter-plugins*'
      - name: Restore owner signing key
        working-directory: hyzen_flutter
        env:
          KEYSTORE_BASE64: ${{ secrets.HYZEN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HYZEN_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.HYZEN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HYZEN_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p android/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/signing/hyzen-release.jks
          printf 'storeFile=signing/hyzen-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          chmod 600 android/key.properties android/signing/hyzen-release.jks
      - name: Build signed APK
        working-directory: hyzen_flutter
        run: flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: Hyzen_1.4.0_signed_and_source
          path: |
            hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk
            PharmD_With_Hyzen_Source_1.4.0.zip
            hyzen_flutter/qa/drive_benchmark_results.json
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hyzen_flutter/build/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Hyzen_1.4_diagnostics
          path: |
            hyzen_flutter/qa/drive_benchmark_results.json
            hyzen_flutter/pubspec.lock

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hyzen_1.4.0_signed_and_source
          path: artifact
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r artifact/hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk
            adb shell monkey -p com.hyzen.pharmd -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.hyzen.pharmd
            adb logcat -d > launch14-logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hyzen_1.4_install_logs
          path: launch14-logcat.txt
