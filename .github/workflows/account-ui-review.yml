name: Account UI validation and browser preview

on:
  workflow_dispatch:
  push:
    branches: [fix/mascot-motion-apk]
    paths:
      - 'hyzen_flutter/**'
      - 'tools/capture_account_preview.cjs'
      - '.github/workflows/account-ui-review.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: account-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - name: Format changed Dart sources for review
        working-directory: hyzen_flutter
        run: |
          dart format lib/features/profile/presentation/profile_screens.dart lib/features/profile/presentation/widgets/account_widgets.dart lib/features/shell/app_shell.dart lib/app/router.dart lib/features/updates/update_ui.dart lib/main_account_review.dart test/account_toggle_test.dart test/navigation_test.dart
      - name: Analyze
        working-directory: hyzen_flutter
        run: flutter analyze --no-pub
      - name: Run regression tests
        working-directory: hyzen_flutter
        run: flutter test --no-pub --reporter expanded
      - name: Build actual app and account review entrypoint for browser
        working-directory: hyzen_flutter
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          flutter build web --release --no-pub --base-href /pharm-d-with-hyzen/ --dart-define=HYZEN_APP_VERSION="$version"
          mv build/web build/app-web
          flutter build web --release --no-pub --target lib/main_account_review.dart --base-href /pharm-d-with-hyzen/ui-review/ --dart-define=HYZEN_APP_VERSION="$version"
          mkdir -p build/app-web/ui-review
          cp -a build/web/. build/app-web/ui-review/
          mkdir -p build/serve/pharm-d-with-hyzen
          cp -a build/app-web/. build/serve/pharm-d-with-hyzen/
          printf '%s\n' "${{ github.sha }}" > build/serve/pharm-d-with-hyzen/commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture actual Flutter browser screens
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 --directory hyzen_flutter/build/serve > /tmp/hyzen-review-server.log 2>&1 &
          node tools/capture_account_preview.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-ui-review-${{ github.sha }}
          path: |
            hyzen_flutter/build/serve/
            hyzen_flutter/qa/account-redesign/
            hyzen_flutter/lib/features/profile/presentation/
            hyzen_flutter/lib/features/shell/app_shell.dart
            hyzen_flutter/lib/app/router.dart
            hyzen_flutter/lib/features/updates/update_ui.dart
            hyzen_flutter/lib/main_account_review.dart
            hyzen_flutter/test/account_toggle_test.dart
            hyzen_flutter/test/navigation_test.dart
            hyzen_flutter/pubspec.lock
          if-no-files-found: error
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: hyzen_flutter/build/serve/pharm-d-with-hyzen

  deploy-preview:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-preview
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed browser build
        id: deployment
        uses: actions/deploy-pages@v4
