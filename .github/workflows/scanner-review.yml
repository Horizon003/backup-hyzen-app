name: Scanner and compact Office checks
on:
  push:
    branches: [codex/scanner-compact-office]
  pull_request:
    branches: [main]
    paths: ['hyzen_flutter/**', 'tools/scan_bench/**']
permissions:
  contents: read
concurrency:
  group: scanner-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - run: flutter analyze --no-pub
        working-directory: hyzen_flutter
      - run: flutter test --no-pub -r expanded --timeout 90s
        working-directory: hyzen_flutter
      - name: Compile Android scanner
        if: ${{ !cancelled() }}
        working-directory: hyzen_flutter/android
        run: ./gradlew :app:compileDebugKotlin
      - name: Build review preview
        if: ${{ !cancelled() }}
        working-directory: hyzen_flutter
        run: flutter build web --release --no-pub --target lib/main_account_review.dart --base-href /pharm-d-with-hyzen/ui-review/
      - uses: actions/upload-artifact@v4
        with:
          name: compact-office-preview
          path: hyzen_flutter/build/web
