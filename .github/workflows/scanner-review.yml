name: Scanner and compact Office checks
on:
  push:
    branches: [codex/scanner-compact-office]
  pull_request:
    branches: [main]
    paths: ['hyzen_flutter/**', 'tools/scan_bench/**', '.github/workflows/scanner-review.yml']
permissions:
  contents: read
concurrency:
  group: scanner-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - run: flutter analyze --no-pub
        working-directory: hyzen_flutter
      - run: flutter test --no-pub -r expanded --timeout 90s
        working-directory: hyzen_flutter
      - name: Compile Android scanner
        if: ${{ !cancelled() }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check Android Kotlin
        if: ${{ !cancelled() }}
        working-directory: hyzen_flutter/android
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > local.properties
          flutter precache --android
          gradle :app:compileDebugKotlin
      - name: Build Android test APK
        if: ${{ !cancelled() }}
        working-directory: hyzen_flutter
        run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('hyzen_flutter/build/app/outputs/flutter-apk/app-debug.apk') != '' }}
        with:
          name: hyzen-android-test-apk
          path: hyzen_flutter/build/app/outputs/flutter-apk/app-debug.apk
      - name: Build review preview
        if: ${{ !cancelled() }}
        working-directory: hyzen_flutter
        run: flutter build web --release --no-pub --target lib/main_account_review.dart --base-href /pharm-d-with-hyzen/ui-review/
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('hyzen_flutter/build/web/index.html') != '' }}
        with:
          name: compact-office-preview
          path: hyzen_flutter/build/web
      - name: Build actual Flutter application
        if: ${{ !cancelled() }}
        working-directory: hyzen_flutter
        run: flutter build web --release --no-pub --base-href /pharm-d-with-hyzen/
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('hyzen_flutter/build/web/main.dart.js') != '' }}
        with:
          name: hyzen-flutter-web
          path: hyzen_flutter/build/web
