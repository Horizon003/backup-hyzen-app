name: Diagnose native PDF release tests
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Signed release workflow run
        required: true
        default: '39096079729'
  push:
    branches: [main]
    paths: ['.github/workflows/native-pdf-check.yml']
permissions:
  actions: read
  contents: read
jobs:
  native-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hyzen_1.4.1_signed_and_source
          path: artifact
          run-id: ${{ inputs.artifact_run || '39096079729' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r artifact/hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk
            adb install -r -t artifact/hyzen_flutter/build/app/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb logcat -c
            adb shell am instrument -w com.hyzen.pharmd.test/androidx.test.runner.AndroidJUnitRunner | tee native-pdf-tests.txt
            adb logcat -d > native-pdf-logcat.txt
            python3 -c "from pathlib import Path; s=Path('native-pdf-tests.txt').read_text(); assert 'OK (' in s and 'FAILURES' not in s, s"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hyzen_1.4.1_native_diagnostics
          path: |
            native-pdf-tests.txt
            native-pdf-logcat.txt
