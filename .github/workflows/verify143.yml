name: Verify signed Hyzen 1.4.3 APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify143.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Hyzen_1.4.3_signed_and_source
          path: artifact
          github-token: ${{ github.token }}
          run-id: 39159856906
      - name: Restore reader UI verification script
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('reader_intent_smoke.py').write_text(json.loads(Path('updates_1_4_3.json').read_text())['qa/reader_intent_smoke.py'])
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r artifact/hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk
            adb shell monkey -p com.hyzen.pharmd -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.hyzen.pharmd
            adb logcat -d > launch14-logcat.txt
            adb install -r -t artifact/hyzen_flutter/build/app/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w com.hyzen.pharmd.test/androidx.test.runner.AndroidJUnitRunner | tee native-pdf-tests.txt
            adb logcat -d > native-pdf-logcat.txt
            python3 -c "from pathlib import Path; s=Path('native-pdf-tests.txt').read_text(); assert 'OK (' in s and 'FAILURES' not in s, s"
            adb shell am force-stop com.hyzen.pharmd
            adb shell am start -W -n com.hyzen.pharmd/.MainActivity -a android.intent.action.VIEW -t application/pdf -d content://com.hyzen.pharmd.updates/shares/external_fixture.pdf
            sleep 10
            adb shell uiautomator dump /sdcard/hyzen-external-cold.xml
            adb pull /sdcard/hyzen-external-cold.xml external-cold.xml
            adb shell screencap -p /sdcard/hyzen-external-cold.png
            adb pull /sdcard/hyzen-external-cold.png external-cold.png
            adb shell am start -W -n com.hyzen.pharmd/.MainActivity -a android.intent.action.VIEW -t application/pdf -d content://com.hyzen.pharmd.updates/shares/external_fixture.pdf
            sleep 5
            adb shell uiautomator dump /sdcard/hyzen-external-warm.xml
            adb pull /sdcard/hyzen-external-warm.xml external-warm.xml
            adb logcat -d > external-intent-logcat.txt
            python3 -c "from pathlib import Path; files=['external-cold.xml','external-warm.xml']; [(lambda s: (print(f),exec(\"assert 'external_fixture.pdf' in s and 'Page unavailable' not in s and 'This page could not be found' not in s\")))(Path(f).read_text()) for f in files]"
            python3 reader_intent_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hyzen_1.4.3_install_logs
          path: |
            launch14-logcat.txt
            native-pdf-tests.txt
            native-pdf-logcat.txt
            external-cold.xml
            external-warm.xml
            external-cold.png
            external-intent-logcat.txt
            reader-*.xml
            reader-hidden.png
            reader-ui-result.txt

