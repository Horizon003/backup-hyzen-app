name: Hyzen design and avatar review checks
on:
  push:
    branches: [work/hyzen-phase-01]
    paths: [updates_phase_01.json, updates_phase_02.json, updates_phase_03.json, updates_phase_04.json, updates_phase_05.json, phase02_assets/**, .github/workflows/phase01-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assemble current application and isolated phase overlay
        run: |
          unzip -q PharmD_With_Hyzen_Source_1.3.3.zip
          cp -a lib/. hyzen_flutter/lib/
          cp -a android/. hyzen_flutter/android/
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('hyzen_flutter').resolve()
          for patch in ['updates_1_4_0.json', 'updates_1_4_1.json', 'updates_1_4_2.json', 'updates_1_4_3.json', 'updates_phase_01.json', 'updates_phase_02.json', 'updates_phase_03.json', 'updates_phase_04.json', 'updates_phase_05.json']:
              for rel, text in json.loads(Path(patch).read_text()).items():
                  target = (root / rel).resolve()
                  if not target.is_relative_to(root) or rel.startswith('android/signing') or rel == 'android/key.properties':
                      raise ValueError('Invalid patch target')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(text)
          PY
          cp -a phase02_assets/. hyzen_flutter/assets/
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - name: Normalize inherited source as in baseline build
        working-directory: hyzen_flutter
        run: |
          dart format lib test
          dart fix --apply
          dart fix --apply --code=curly_braces_in_flow_control_structures
          dart format lib test
      - run: flutter analyze --no-pub
        working-directory: hyzen_flutter
      - name: Unit and widget regression suite
        working-directory: hyzen_flutter
        run: flutter test --no-pub --reporter expanded
      - name: Capture review screens (not a golden comparison)
        working-directory: hyzen_flutter
        run: flutter test test/navigation_test.dart test/symbol_state_test.dart --no-pub --dart-define=HYZEN_CAPTURE_QA=true --update-goldens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyzen-phase01-review
          path: |
            hyzen_flutter/qa/*.png
            hyzen_flutter/pubspec.lock
          if-no-files-found: warn
  native-review:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Reserve disk for Android emulator on disposable runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Assemble the same review overlays
        run: |
          unzip -q PharmD_With_Hyzen_Source_1.3.3.zip
          cp -a lib/. hyzen_flutter/lib/
          cp -a android/. hyzen_flutter/android/
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('hyzen_flutter').resolve()
          for patch in ['updates_1_4_0.json', 'updates_1_4_1.json', 'updates_1_4_2.json', 'updates_1_4_3.json', 'updates_phase_01.json', 'updates_phase_02.json', 'updates_phase_03.json', 'updates_phase_04.json', 'updates_phase_05.json']:
              for rel, text in json.loads(Path(patch).read_text()).items():
                  target = (root / rel).resolve()
                  if not target.is_relative_to(root) or rel.startswith('android/signing') or rel == 'android/key.properties':
                      raise ValueError('Invalid patch target')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(text)
          gradle = root / 'android/app/build.gradle.kts'
          content = gradle.read_text()
          assert 'testBuildType = "release"' in content
          gradle.write_text(content.replace('testBuildType = "release"', 'testBuildType = "debug"'))
          PY
          cp -a phase02_assets/. hyzen_flutter/assets/
      - name: Prepare only development signing for the fresh emulator
        working-directory: hyzen_flutter
        run: |
          mkdir -p android/test-signing
          if [ ! -f android/test-signing/hyzen-test.keystore ]; then
            keytool -genkeypair -noprompt -storetype JKS -keystore android/test-signing/hyzen-test.keystore -alias AndroidDebugKey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname 'CN=Hyzen emulator review'
          fi
          chmod +x android/gradlew
      - run: flutter pub get
        working-directory: hyzen_flutter
      - name: Build review debug application and native tests
        working-directory: hyzen_flutter
        run: |
          flutter build apk --debug --target-platform android-x64 --no-pub
          cd android
          ./gradlew :app:assembleDebugAndroidTest --no-daemon
      - name: Verify emulator disk headroom
        run: |
          df -h /
          python3 -c "import shutil; free=shutil.disk_usage('/').free; print(f'Free bytes before emulator: {free}'); assert free >= 8 * 1024**3, 'Need 8 GiB for emulator image and AVD'"
      - name: Enable emulator KVM (same setup as existing verification)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          script: |
            adb install -r hyzen_flutter/build/app/outputs/flutter-apk/app-debug.apk
            adb install -r -t hyzen_flutter/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.hyzen.pharmd.test/androidx.test.runner.AndroidJUnitRunner | tee native-review-tests.txt
            python3 -c "from pathlib import Path; s=Path('native-review-tests.txt').read_text(); assert 'OK (' in s and 'FAILURES' not in s, s"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyzen-native-review-evidence
          path: |
            native-review-tests.txt
            hyzen_flutter/build/app/reports/androidTests/
          if-no-files-found: warn
