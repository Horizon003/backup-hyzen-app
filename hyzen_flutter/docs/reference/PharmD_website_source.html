<style>
/* ============ Design tokens ============ */
:root{
  --ink:#0B1B2B;            /* deep navy — headings, primary text */
  --ink-2:#3E5468;          /* secondary text */
  --ink-3:#7C8DA0;          /* tertiary / placeholders */
  --accent:#087747;         /* medical blue */
  --accent-ink:#045936;
  --bg:#FAFBFD;             /* page background */
  --surface:#FFFFFF;
  --line:rgba(11,27,43,.08);
  --line-strong:rgba(11,27,43,.14);
  --tint:#F1F5FA;           /* soft section fill */
  --tint-accent:#EAF1FC;
  --ok:#1F9D5B; --ok-bg:#E8F6EE;
  --warn:#C97A17; --warn-bg:#FBF1E2;
  --bad:#D64545; --bad-bg:#FBEAEA;
  --glass:rgba(255,255,255,.72);
  --blur:saturate(1.4) blur(16px);
  --r1:10px; --r2:16px; --r3:24px; --pill:999px;
  --sh1:0 1px 2px rgba(11,27,43,.05);
  --sh2:0 1px 2px rgba(11,27,43,.04),0 8px 24px rgba(11,27,43,.07);
  --sh3:0 2px 4px rgba(11,27,43,.05),0 20px 48px rgba(11,27,43,.14);
  --ease:cubic-bezier(.22,1,.36,1);
  --pad:clamp(16px,4vw,28px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;touch-action:manipulation}
html,body{width:100%;max-width:100%;overflow-x:clip;overscroll-behavior-y:none}
body{font-family:Inter,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.65;color:var(--ink);background:transparent;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
a,button,input,select,label,summary{touch-action:manipulation}

/* ============ Animated grid background (Vercel / Linear style) ============ */
#bgfx{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;background:
  linear-gradient(180deg,#FAFBFD 0%,#F4F8FE 45%,#FAFBFD 100%)}
#bgfx .grid{position:absolute;inset:-2px;background-image:
  linear-gradient(color-mix(in srgb,var(--accent) calc(100% * .09),transparent) 1px,transparent 1px),
  linear-gradient(90deg,color-mix(in srgb,var(--accent) calc(100% * .09),transparent) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(120% 90% at 50% 0%,#000 40%,transparent 100%);
  mask-image:radial-gradient(120% 90% at 50% 0%,#000 40%,transparent 100%)}
#bgfx .sweep{position:absolute;top:-40%;left:-40%;width:80%;height:80%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) calc(100% * .16),transparent),transparent 70%);
  filter:blur(24px);animation:sweep 18s var(--ease) infinite;will-change:transform}
#bgfx .sweep.b{animation-duration:24s;animation-delay:-8s;
  background:radial-gradient(closest-side,rgba(29,95,196,.12),transparent 70%)}
@keyframes sweep{
  0%{transform:translate(0,0)}
  25%{transform:translate(90vw,10vh)}
  50%{transform:translate(70vw,55vh)}
  75%{transform:translate(10vw,40vh)}
  100%{transform:translate(0,0)}}
#bgfx .particles{position:absolute;inset:0}
#bgfx .p{position:absolute;width:3px;height:3px;border-radius:50%;background:color-mix(in srgb,var(--accent) calc(100% * .5),transparent);
  box-shadow:0 0 6px 1px color-mix(in srgb,var(--accent) calc(100% * .35),transparent);opacity:.16;animation:float linear infinite;will-change:transform}
@keyframes float{from{transform:translateY(12vh)}to{transform:translateY(-110vh)}}
@media(prefers-reduced-motion:reduce){#bgfx .sweep,#bgfx .p{animation:none}}
/* Mobile: static grid only — animated blurred layers cause scroll jank on low-end phones */
@media(max-width:768px){
  #bgfx .grid{background-size:38px 38px}
  #bgfx .sweep{animation:none;filter:blur(40px);opacity:.7;top:-20%;left:10%;transform:none}
  #bgfx .sweep.b{display:none}
  #bgfx .p{display:none}
}

/* glassmorphism section wrapper used across pages */
.glass-sec{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.65);border-radius:var(--r3);box-shadow:var(--sh2)}
::selection{background:var(--tint-accent)}
h1,h2,h3,h4{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;line-height:1.18;font-weight:600}
h1{font-size:clamp(28px,6vw,42px);font-weight:700}
h2{font-size:clamp(22px,4vw,28px)}
h3{font-size:clamp(17px,3vw,20px)}
h4{font-size:15.5px}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
img{max-width:100%;display:block}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.container{max-width:1120px;margin:0 auto;padding:0 var(--pad)}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-variant-numeric:tabular-nums}

/* ============ Announcement bar ============ */
#annWrap a.annlink{color:inherit;text-decoration:underline;text-underline-offset:3px;font-weight:600;margin-left:10px;white-space:nowrap}
#annBar{font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 16px;text-align:center;letter-spacing:.01em}
#annBar .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ Header ============ */
header.top{position:sticky;top:0;z-index:80;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--line)}
header.top .inner{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);min-width:0}
.brand .mark{width:34px;height:34px;border-radius:10px;overflow:hidden;flex:none;box-shadow:var(--sh1)}
.brand .mark img{width:100%;height:100%;object-fit:cover}
.brand .plate{height:26px;width:auto;max-width:150px;object-fit:contain}
.brand .word{font-family:"Space Grotesk";font-weight:700;font-size:17.5px;letter-spacing:-.02em;white-space:nowrap}
nav.deskNav{display:none;gap:2px;margin-left:6px}
nav.deskNav a{padding:8px 13px;border-radius:var(--pill);font-size:13.5px;font-weight:500;color:var(--ink-2);transition:all .18s var(--ease)}
nav.deskNav a:hover{color:var(--ink);background:var(--tint)}
nav.deskNav a.active{color:var(--ink);background:var(--tint)}
.hd-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.searchTrigger{display:flex;align-items:center;gap:9px;background:rgba(11,27,43,.045);border:1px solid transparent;border-radius:var(--pill);padding:8px 14px;color:var(--ink-3);font-size:13.5px;transition:all .18s var(--ease);min-width:0}
.searchTrigger:hover{border-color:var(--line-strong);background:#fff}
.searchTrigger .kbd{margin-left:8px;font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink-3);background:#fff;display:none}
@media(min-width:720px){.searchTrigger .kbd{display:inline}}
.searchTrigger span.lbl{display:none}
@media(min-width:480px){.searchTrigger span.lbl{display:inline}}
.iconBtn{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:var(--pill);border:1px solid transparent;background:transparent;color:var(--ink);transition:all .18s var(--ease)}
.iconBtn:hover{background:var(--tint);border-color:var(--line)}
.dot{position:absolute;top:4px;right:4px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
@media(min-width:960px){nav.deskNav{display:flex}}

/* ============ Bottom nav (mobile) ============ */
nav.bottom{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:90;
  background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.62));
  backdrop-filter:saturate(1.8) blur(22px);-webkit-backdrop-filter:saturate(1.8) blur(22px);
  border:1px solid rgba(255,255,255,.6);border-radius:22px;
  box-shadow:0 8px 30px rgba(11,27,43,.14),0 1px 0 rgba(255,255,255,.7) inset,0 -0.5px 0 rgba(11,27,43,.05) inset;
  display:flex;height:62px;max-width:520px;margin:0 auto;padding:6px;gap:2px}
nav.bottom a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9.5px;white-space:nowrap;font-weight:600;color:var(--ink-3);position:relative;border-radius:16px;transition:color .22s var(--ease,ease),background .22s var(--ease,ease),transform .22s var(--ease,ease)}
nav.bottom a svg.ic{width:21px;height:21px;transition:transform .22s var(--ease,ease)}
nav.bottom a:active{transform:scale(.94)}
nav.bottom a.active{color:var(--accent);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) calc(100% * .16),transparent),color-mix(in srgb,var(--accent) calc(100% * .08),transparent));box-shadow:0 1px 0 rgba(255,255,255,.5) inset}
nav.bottom a.active svg.ic{transform:translateY(-1px)}
nav.bottom .nbadge{position:absolute;top:7px;left:calc(50% + 5px);background:var(--accent);color:#fff;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:8px;display:grid;place-items:center;padding:0 3px;box-shadow:0 1px 4px color-mix(in srgb,var(--accent) calc(100% * .5),transparent)}
@media(min-width:960px){nav.bottom{display:none}}
main{padding-bottom:110px;min-height:72vh}
@media(min-width:960px){main{padding-bottom:48px}}

/* ============ Buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--pill);font-weight:600;font-size:14px;padding:10px 20px;border:1px solid transparent;transition:all .18s var(--ease);line-height:1.3;min-height:42px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px color-mix(in srgb,var(--accent) calc(100% * .3),transparent)}
.btn-primary:hover{background:var(--accent-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) calc(100% * .32),transparent)}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover{background:#16324b}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-ghost:hover{border-color:var(--ink-3);background:var(--tint)}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{padding:7px 14px;font-size:13px;min-height:34px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink-2);transition:border-color .15s var(--ease),color .15s var(--ease),background .15s var(--ease);min-width:30px;min-height:30px}
.tbtn:hover{border-color:var(--accent);color:var(--accent);background:#FBFDFF}
.tbtn:active{transform:scale(.95)}
.tbtn svg.ic{width:13px;height:13px}
.tbtn.on{background:var(--tint-accent);border-color:var(--accent);color:var(--accent)}
@media(pointer:coarse){.tbtn{min-width:36px;min-height:36px;border-radius:10px}}

/* ============ Cards / panels ============ */
.card{background:rgba(255,255,255,.86);backdrop-filter:saturate(1.15) blur(6px);-webkit-backdrop-filter:saturate(1.15) blur(6px);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh1);transition:box-shadow .22s var(--ease),transform .22s var(--ease),border-color .22s}
.card.hov:hover{box-shadow:var(--sh2);transform:translateY(-2px);border-color:var(--line-strong)}
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,.6);box-shadow:var(--sh2)}
.pad{padding:clamp(18px,3vw,26px)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.02em;padding:3px 10px;border-radius:var(--pill)}
.tag svg.ic{width:11px;height:11px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.blue{background:var(--tint-accent);color:var(--accent-ink)}
.tag.mut{background:var(--tint);color:var(--ink-3)}.tag.ink{background:var(--ink);color:#fff}
.divider{border:none;border-top:1px solid var(--line);margin:18px 0}

/* ============ Page scaffolding ============ */
.page{padding:clamp(22px,4vw,36px) 0 40px;animation:pagein .3s var(--ease)}
.adm-page{animation:pagein .3s var(--ease)}
/* In admin, hide the public site chrome (top nav, announcement, bottom tab bar) */
body.in-admin > header.top,body.in-admin #annWrap,body.in-admin nav.bottom,body.in-admin > footer.site{display:none!important}
body.in-admin #bgfx{opacity:.5}
/* Dashboard opening — secure control-panel reveal */
@keyframes admIn{0%{opacity:0;transform:translateY(14px) scale(.99);filter:blur(8px)}55%{filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
.adm-page.adm-enter{animation:admIn .4s var(--ease) both}
@keyframes admSlide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.adm-enter .adm-sidebar{animation:admSlide .4s var(--ease) .05s both}
@keyframes admRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.adm-enter .stat-card,.adm-enter .drill-card{animation:admRise .35s var(--ease) both}
.adm-enter .stat-card:nth-child(2),.adm-enter .drill-card:nth-child(2){animation-delay:.04s}
.adm-enter .stat-card:nth-child(3),.adm-enter .drill-card:nth-child(3){animation-delay:.08s}
.adm-enter .stat-card:nth-child(4),.adm-enter .drill-card:nth-child(4){animation-delay:.12s}
.adm-enter .stat-card:nth-child(5),.adm-enter .drill-card:nth-child(5){animation-delay:.16s}
.adm-enter .stat-card:nth-child(n+6),.adm-enter .drill-card:nth-child(n+6){animation-delay:.2s}
.adm-page.still{animation:none}
.still .adm-sidebar,.still .stat-card,.still .drill-card{animation:none}
@keyframes pagein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:clamp(18px,3vw,26px)}
.page-head p{margin-top:4px}
.crumbs{display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12.5px;color:var(--ink-3);margin-bottom:14px}
.crumbs a{color:var(--ink-3)}.crumbs a:hover{color:var(--accent)}
.crumbs svg.ic{width:12px;height:12px;opacity:.6}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 16px}
.section-title a{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px}

/* list tiles */
.tiles{display:grid;gap:10px}
/* PDP qty + product form imgs + rte */
.qtyrow{display:flex;align-items:center;gap:8px}
.qtyrow input{width:64px;text-align:center;padding:9px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-weight:700;font-size:14px}
.pr-imgs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:10px}
.pr-thumb{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
.pr-thumb.cover{border-color:var(--accent)}
.pr-thumb img{width:100%;height:100%;object-fit:cover}
.pr-cover-tag{position:absolute;left:0;right:0;bottom:0;font-size:8.5px;font-weight:700;text-align:center;background:var(--accent);color:#fff;padding:1.5px 0}
.pr-mini{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:6px;background:rgba(255,255,255,.92);display:grid;place-items:center;border:none;cursor:pointer;color:var(--ink-2)}
.pr-mini.del{left:auto;right:2px;color:#C93B3B}
.rte-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.rte-bar .tbtn{padding:6px 10px;font-size:12px}
.rte-preview{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;min-height:44px;background:var(--surface);font-size:13.5px}
/* Crop editor */
#cropOverlay{position:fixed;inset:0;z-index:10000;background:rgba(11,27,43,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px}
.crop-box{background:var(--surface);border-radius:20px;padding:20px;width:min(340px,92vw);box-shadow:var(--sh3)}
.crop-vp{position:relative;width:260px;height:260px;margin:0 auto;overflow:hidden;border-radius:16px;background:#0B1B2B;cursor:grab;touch-action:none}
.crop-vp:active{cursor:grabbing}
.crop-vp img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:none;user-select:none;pointer-events:none}
.crop-mask{position:absolute;inset:0;pointer-events:none;box-shadow:0 0 0 999px rgba(11,27,43,.55) inset;border-radius:0;background:radial-gradient(circle at center,transparent 0,transparent 42%,rgba(11,27,43,.55) 42.5%)}
.crop-mask::after{content:"";position:absolute;left:50%;top:50%;width:84%;height:84%;transform:translate(-50%,-50%);border:2px dashed rgba(255,255,255,.85);border-radius:50%}
/* MCQ practice */
.mcq-opts{display:grid;gap:9px}
.mcq-opt{display:flex;align-items:center;gap:11px;text-align:left;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink);transition:.15s;cursor:pointer}
.mcq-opt:not(:disabled):hover{border-color:var(--accent)}
.mcq-letter{width:26px;height:26px;border-radius:8px;background:var(--tint);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.mcq-opt.right{border-color:#1E7A34;background:color-mix(in srgb,#1E7A34 10%,var(--surface));color:#1E7A34;font-weight:700}
.mcq-opt.right .mcq-letter{background:#1E7A34;color:#fff}
.mcq-opt.wrong{border-color:#C93B3B;background:color-mix(in srgb,#C93B3B 8%,var(--surface));color:#C93B3B}
.mcq-opt.wrong .mcq-letter{background:#C93B3B;color:#fff}
.mcq-exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--tint);font-size:13px;line-height:1.6;color:var(--ink-2)}
/* Credits */
.credit-grid{display:grid;gap:14px}
.credit-grid.g2{grid-template-columns:repeat(2,1fr)}
.credit-grid.g3{grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:639px){
  .credit-grid .credit-card{padding:14px 10px}
  .credit-grid .credit-card .cc-photo{width:58px;height:58px}
  .credit-grid .credit-card .cc-name{font-size:13.5px}
  .credit-grid .credit-card .cc-desig{font-size:11px}
  .credit-grid .credit-card .cc-desc{font-size:11.5px}
  .credit-grid.g3 .credit-card .cc-photo{width:48px;height:48px}
  .credit-grid.g3 .credit-card .cc-desc{display:none}
}
.credit-feature{margin-bottom:14px}
.credit-feature .credit-card{max-width:520px;margin:0 auto}
.credit-stack{display:grid;gap:0}

.cc-gradient .cc-photo{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.8);color:#fff}
/* Social buttons */
.social-row{display:flex;flex-wrap:wrap;gap:10px}
.social-btn{display:inline-flex;align-items:center;gap:9px;padding:9px 15px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;transition:.15s}
.social-btn svg{color:var(--sc)}
.social-btn:hover{border-color:var(--sc);box-shadow:0 4px 16px color-mix(in srgb,var(--sc) 24%,transparent);transform:translateY(-1px)}
/* Boot splash / fatal-error overlay */
.pw-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg,#f7f9fc);transition:opacity .35s ease}
.pw-splash.gone{opacity:0;pointer-events:none}
.pw-splash-in{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px}
.pw-splash-mark{width:76px;height:76px;border-radius:22px;overflow:hidden;display:grid;place-items:center;box-shadow:0 12px 34px rgba(11,27,43,.16);background:#fff}
.pw-splash-mark img,.pw-splash-mark svg{width:100%;height:100%;object-fit:cover}
.pw-spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(31,111,178,.2);border-top-color:var(--accent,#1F6FB2);animation:pwspin .8s linear infinite}
@keyframes pwspin{to{transform:rotate(360deg)}}

/* ===== UI/UX polish: animated backdrop, splash exit, welcome + sign-in overlays ===== */
/* Lightweight GPU-friendly animated grid + ambient glow — sits BEHIND all content. */
.pw-fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.pw-fx-grid{position:absolute;inset:-2px;background-image:
  linear-gradient(color-mix(in srgb,var(--accent) calc(100% * .10),transparent) 1px,transparent 1px),
  linear-gradient(90deg,color-mix(in srgb,var(--accent) calc(100% * .10),transparent) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(120% 90% at 50% 40%,#000 30%,transparent 100%);
  mask-image:radial-gradient(120% 90% at 50% 40%,#000 30%,transparent 100%);
  animation:pwGridDrift 9s linear infinite;will-change:transform}
@keyframes pwGridDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-44px,0)}}
.pw-fx-glow{position:absolute;border-radius:50%;filter:blur(38px);will-change:transform,opacity;opacity:.6}
.pw-fx-glow.g1{width:340px;height:340px;left:-60px;top:-40px;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) calc(100% * .28),transparent),transparent 70%);animation:pwFloat1 7s ease-in-out infinite}
.pw-fx-glow.g2{width:300px;height:300px;right:-50px;bottom:-30px;background:radial-gradient(closest-side,rgba(29,95,196,.22),transparent 70%);animation:pwFloat2 8s ease-in-out infinite}
.pw-fx-sweep{position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);animation:pwSweep 4.5s ease-in-out infinite;will-change:transform}
@keyframes pwFloat1{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(30px,26px,0)}}
@keyframes pwFloat2{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-26px,-22px,0)}}
@keyframes pwSweep{0%{transform:translateX(0)}55%,100%{transform:translateX(360%)}}
.pw-splash-in{position:relative;z-index:1}
/* Splash exit: smooth upward shutter + gentle fade (GPU transform only) */
.pw-splash.exiting{animation:pwSplashExit .85s cubic-bezier(.65,0,.35,1) forwards;will-change:transform,opacity}
@keyframes pwSplashExit{0%{transform:translateY(0);opacity:1}70%{opacity:1}100%{transform:translateY(-101%);opacity:.6}}
/* Brighter grid on the welcome overlay's darker backdrop */
.pw-welcome .pw-fx-grid{background-image:
  linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px)}
.pw-welcome .pw-fx-glow.g1{background:radial-gradient(closest-side,rgba(120,170,255,.4),transparent 70%)}
.pw-welcome .pw-fx-glow.g2{background:radial-gradient(closest-side,rgba(80,140,240,.34),transparent 70%)}

/* Centered welcome overlay — fullscreen blurred grid backdrop + dark-blue card */
.pw-welcome{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(135deg,rgba(19,74,124,.22),rgba(29,95,196,.20));
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;animation:pwWelcomeIn .4s var(--ease,ease) forwards}
.pw-welcome.out{animation:pwWelcomeOut .5s ease forwards}
@keyframes pwWelcomeIn{to{opacity:1}}
@keyframes pwWelcomeOut{to{opacity:0}}
/* The animated fx (grid + glow) fills the whole screen, behind the card. */
.pw-welcome > .pw-fx{position:fixed;inset:0;z-index:0}
.pw-welcome-card{position:relative;z-index:2;overflow:hidden;min-width:min(84vw,320px);padding:36px 40px;border-radius:24px;text-align:center;
  color:#fff;border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(150deg,#134A7C 0%,var(--accent-ink) 55%,var(--accent) 100%);
  box-shadow:0 24px 70px rgba(11,27,43,.42),0 1px 0 rgba(255,255,255,.18) inset;
  transform:scale(.9) translateY(6px);opacity:0;animation:pwCardIn .55s var(--ease,cubic-bezier(.22,1,.36,1)) .05s forwards}
@keyframes pwCardIn{to{transform:scale(1) translateY(0);opacity:1}}
.wc-content{position:relative;z-index:2}
.wc-logo{width:72px;height:72px;margin:0 auto 16px;border-radius:20px;overflow:hidden;display:grid;place-items:center;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);box-shadow:0 8px 24px rgba(11,27,43,.3)}
.wc-logo img,.wc-logo svg{width:100%;height:100%;object-fit:cover}
.pw-welcome-card .wc-eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.88);margin-bottom:6px}
.pw-welcome-card h2{font-size:clamp(21px,4.5vw,27px);color:#fff;margin:0;line-height:1.25;font-weight:700}

/* Fullscreen sign-in loading overlay */
.pw-signing{position:fixed;inset:0;z-index:10001;display:grid;place-items:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) calc(100% * .14),transparent),rgba(29,95,196,.14));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;animation:pwWelcomeIn .3s ease forwards}
.pw-signing.out{animation:pwWelcomeOut .35s ease forwards}
.pw-signing-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px}
.pw-signing-in .lbl{font-size:15px;font-weight:600;color:var(--ink,#0B1B2B)}

.pw-dots span:nth-child(2){animation-delay:.18s}
.pw-dots span:nth-child(3){animation-delay:.36s}
@keyframes pwDot{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){
  .pw-fx-grid,.pw-fx-glow,.pw-fx-sweep{animation:none}
  .pw-splash.exiting{animation-duration:.3s}
  .pw-welcome,.pw-welcome-card,.pw-signing{animation-duration:.2s}
}

/* Import history + dedicated delete/data manager */

.dm-toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.dm-toolbar .select{min-width:150px}.dm-search{flex:1;min-width:190px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}.dm-search input{border:0;outline:0;background:transparent;width:100%;font-size:13px}.dm-summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.dm-list{display:grid;gap:8px}.dm-row{display:flex;align-items:center;gap:11px;padding:12px 13px}.dm-check{width:24px;height:24px;border:1.5px solid var(--line-strong);border-radius:7px;display:grid;place-items:center;flex:none;color:transparent;cursor:pointer;background:var(--surface)}.dm-check.on{background:var(--accent);border-color:var(--accent);color:#fff}.dm-row .dm-icon{width:34px;height:34px;border-radius:10px;background:var(--tint);display:grid;place-items:center;color:var(--ink-2);flex:none}.dm-row .dm-main{min-width:0;flex:1}.dm-row .dm-main b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dm-row .dm-path{display:block;font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.dm-row .dm-acts{flex:none}.dm-bulk{position:sticky;bottom:10px;z-index:12;margin-top:12px;padding:9px 10px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);box-shadow:var(--sh2);display:flex;align-items:center;gap:8px}.dm-bulk .count{font-size:12px;font-weight:700}.dm-bulk .btn-danger{margin-left:auto}

/* ============ Overlays ============ */
.overlay{position:fixed;inset:0;background:rgba(11,27,43,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:250;display:grid;place-items:start center;padding:5vh 14px 24px;overflow:auto;animation:ovin .2s ease}

<style id="pharmacy-v2">/* Pharmacy UI revision 2 */
.cc-gradient .cc-photo{border-color:var(--cc-accent)}
:root[data-theme="mint"]{--accent:#167e74;--accent-ink:#105c54;--tint-accent:#d5f5ed;--bg:#f1fbf8;--glow:#167e7440}:root[data-theme="sage"]{--accent:#60734d;--accent-ink:#445334;--tint-accent:#e7eedb;--bg:#f8faf3;--glow:#60734d40}:root[data-theme="amber"]{--accent:#a16b16;--accent-ink:#775011;--tint-accent:#fbefcf;--bg:#fffbf1;--glow:#a16b1640}:root[data-theme="rose"]{--accent:#ad5575;--accent-ink:#843956;--tint-accent:#fae2ec;--bg:#fff6fa;--glow:#ad557540}:root[data-theme="teal"]{--accent:#177c90;--accent-ink:#0d5665;--tint-accent:#daf2f6;--bg:#f2fafc;--glow:#177c9040}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

body.tour-open .radial-scrim{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
body.tour-open .radial-panel:before{box-shadow:none}
.pt-card{transition:top .55s cubic-bezier(.22,1,.36,1),transform .45s cubic-bezier(.22,1,.36,1),opacity .3s ease!important}
@media(prefers-reduced-motion:reduce){.pt-ring.pt-tap .pt-hand,.pt-ring.pt-tap .pt-ripple{animation:none}#app.pt-fade{animation:none}}
.pt-dots{display:flex;gap:5px}.pt-dots i{width:6px;height:6px;border-radius:6px;background:var(--line-strong);transition:width .35s,background .35s}.pt-dots i.done{background:color-mix(in srgb,var(--accent) 45%,transparent)}.pt-dots i.on{width:20px;background:var(--accent)}
.pt-btns{display:flex;gap:8px}
.pt-next{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;cursor:pointer;transition:transform .15s}.pt-next:active{transform:scale(.96)}
.pt-back{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}.pt-back svg{transform:rotate(180deg)}
body.tour-open .radial-dock{pointer-events:none}
@media(prefers-reduced-motion:reduce){.pt-card,.pt-ring,.pt-w,.pt-text,.pt-chips span,.pt-icon,.pt-pulse{animation:none!important;transition:none!important;opacity:1!important;transform:translate3d(-50%,0,0)!important}.pt-w,.pt-text,.pt-chips span,.pt-icon{transform:none!important}}
/* ===== Radial dock: Home stays centre, current section prominent ===== */
.radial-item{transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s}
.radial-item.radial-current .bubble{background:var(--accent)!important;color:#fff!important;border-color:#fff!important;box-shadow:0 0 0 3px var(--accent),0 8px 26px var(--glow)!important;transform:scale(1.12)}
.radial-item.radial-current>span:nth-child(2){background:var(--accent);color:#fff!important;text-shadow:none!important;padding:4px 8px;border-radius:8px}
.radial-here{position:absolute;top:-20px;font-style:normal;font-size:9px;font-weight:700;white-space:nowrap;background:var(--surface);color:var(--accent-ink);padding:2px 7px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.12);animation:hereBob 1.8s ease-in-out infinite}
@keyframes hereBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.radial-item.radial-picked .bubble{transform:scale(1.2);box-shadow:0 0 0 4px var(--accent),0 10px 30px var(--glow)!important;transition:transform .25s}
.radial-dock:not(.open) .radial-trigger .radial-symbol{transition:transform .3s}
/* ===== External-open sheet ===== */
.ext-sheet{position:fixed;inset:0;z-index:16000;display:flex;align-items:flex-end;justify-content:center}
.ext-back{position:absolute;inset:0;background:rgba(8,20,15,.35);opacity:0;transition:opacity .25s}
.ext-card{position:relative;width:min(100%,440px);margin:0 10px calc(10px + env(safe-area-inset-bottom));padding:22px 20px 16px;background:var(--surface);color:var(--ink);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center;transform:translateY(40px);opacity:0;transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .25s}
.ext-sheet.in .ext-back{opacity:1}.ext-sheet.in .ext-card{transform:none;opacity:1}
.ext-icon{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--tint-accent);color:var(--accent);margin-bottom:10px}.ext-icon svg{width:26px;height:26px}
.ext-card h3{font-size:18px;margin-bottom:6px}.ext-card p{font-size:13px;line-height:1.55;color:var(--ink-2)}
.ext-domain{display:inline-block;margin:10px 0 2px;font-size:11px;padding:4px 10px;border-radius:99px;background:var(--line);color:var(--ink-2)}
.ext-go{width:100%;justify-content:center;margin-top:14px;min-height:46px}
.ext-row{display:flex;gap:8px;margin-top:8px}.ext-row .btn{flex:1;justify-content:center}
.ext-hint{display:block;margin-top:10px;font-size:11px;color:var(--ink-3)}
/* ===== Download sheet (copy link + open in Drive) ===== */
.dl-sheet{z-index:16500}
.dl-sheet .ext-card{text-align:left;padding-top:24px}
.dl-sheet .ext-icon,.dl-sheet h3,.dl-sheet .dl-name{display:block;text-align:center;margin-left:auto;margin-right:auto}
.dl-sheet .ext-icon{display:grid}
.dl-x{position:absolute;top:12px;right:12px;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--line);color:var(--ink);cursor:pointer}
.dl-name{font-size:12px;color:var(--ink-3);margin-bottom:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90%}
.dl-label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink-3);margin-bottom:6px;text-transform:uppercase}
.dl-linkrow{display:flex;gap:8px;align-items:stretch}
.dl-linkrow input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line-strong);border-radius:12px;background:var(--bg);color:var(--ink);font-size:12px;font-family:ui-monospace,monospace}
.dl-copy{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:44px}
.dl-copy.copied{background:var(--accent);color:#fff;border-color:var(--accent)}
.dl-sheet .ext-go{display:flex;align-items:center;gap:8px;margin-top:12px}
.dl-steps{margin:14px 0 2px;padding:12px 12px 12px 30px;border-radius:12px;background:var(--tint-accent);font-size:12px;line-height:1.7;color:var(--ink-2)}
.dl-steps .lucide-icon{width:14px;height:14px;vertical-align:-2px}
/* ===== Full-screen notice: entrance animation ===== */
#noticeHost .notice-stage{animation:nFade .35s ease both}
#noticeHost .notice-card{animation:nRise .55s cubic-bezier(.22,1,.36,1) both}
@keyframes nFade{from{opacity:0}to{opacity:1}}@keyframes nRise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
/* ===== Notification studio ===== */
.ns-studio .ns-h{font-size:13px;margin:18px 0 10px;color:var(--ink-2)}
.ns-live{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line-strong);background:var(--bg);margin-top:14px}
.ns-live b{display:block;font-size:13px}.ns-live small{font-size:11px;color:var(--ink-3)}.ns-live>div{flex:1;min-width:0}
.ns-dot{width:10px;height:10px;border-radius:50%;background:var(--ink-3);flex:none}
.ns-live.is-live{border-color:color-mix(in srgb,var(--accent) 40%,transparent)}.ns-live.is-live .ns-dot{background:#1db954;box-shadow:0 0 0 0 #1db95488;animation:nsLive 1.6s infinite}
@keyframes nsLive{0%{box-shadow:0 0 0 0 #1db95488}100%{box-shadow:0 0 0 10px #1db95400}}
.ns-presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ns-preset{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);font-size:11px;font-weight:600;color:var(--ink);cursor:pointer;transition:transform .15s,border-color .2s}
.ns-preset:hover{transform:translateY(-2px);border-color:var(--accent)}
.ns-preset>span{display:grid;gap:4px;width:100%;height:48px;padding:8px;border-radius:9px;background:var(--pbg)}
.ns-preset>span i{display:block;height:5px;border-radius:4px;background:var(--pcard)}.ns-preset>span i:last-child{background:var(--pac);width:60%;margin:0 auto}
.ns-group{border:1px solid var(--line);border-radius:14px;margin-top:10px;background:var(--surface)}
.ns-group>summary{display:flex;align-items:center;gap:8px;padding:13px 14px;cursor:pointer;list-style:none;font-size:13px}
.ns-group>summary::-webkit-details-marker{display:none}.ns-group>summary b{flex:1}
.ns-group>summary svg:last-child{transition:transform .25s}.ns-group[open]>summary svg:last-child{transform:rotate(90deg)}
.ns-group>.notice-fields{padding:0 14px 14px}
.ns-seg{display:flex;gap:4px;padding:3px;border-radius:10px;background:var(--bg);border:1px solid var(--line-strong)}
.ns-seg button{flex:1;padding:8px 6px;border:0;border-radius:8px;background:none;font-size:12px;color:var(--ink-2);cursor:pointer;transition:background .2s,color .2s}
.ns-seg button.on{background:var(--accent);color:#fff}
.ns-color span{display:flex;align-items:center;gap:8px}.ns-color input[type=color]{width:44px!important;flex:none}.ns-color code{font-size:11px;color:var(--ink-3)}
.notice-fields output{font-weight:700;color:var(--accent-ink);font-size:11px}
.notice-fields input[type=range]{padding:0;accent-color:var(--accent)}
.ns-live-tag{font-size:10px;font-weight:600;color:var(--accent-ink);background:var(--tint-accent);padding:3px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.ns-phone{position:relative;padding:26px 10px 12px;border-radius:34px;background:#111;box-shadow:0 18px 50px rgba(0,0,0,.25);max-width:360px;margin:0 auto}
.ns-notch{position:absolute;top:9px;left:50%;width:80px;height:8px;border-radius:8px;background:#2a2a2a;transform:translateX(-50%)}
.ns-phone #noticePreview{border-radius:24px;border:0;max-height:620px;overflow:auto}
#noticePreview .notice-card{transition:all .25s ease}
#noticePreview.ns-flash{animation:nsFlash .6s ease}@keyframes nsFlash{0%{transform:scale(.97);opacity:.6}100%{transform:none;opacity:1}}
@media(max-width:560px){.ns-presets{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],
      [6, 28, 50, 72, 94],
      [6, 26, 50, 74, 98],
      [6, 30, 54, 78, 102],

  fb:null, db:null, auth:null, ready:false, cfg:null, cloud:null, adminUid:null, isAdmin:false,

  // Admin-side: drain the public inbox into the canonical pw_orders list.
  async drainOrderInbox(){
    if(!this.ready||!this.isAdmin) return 0;
    const fs=this._fs; let merged=0;
    try{
      const snap=await fs.getDocs(fs.collection(this.db,"orders_inbox"));
      if(snap.empty) return 0;
      const orders=Repo.orders.list();
      const toDelete=[];
      // Stock decrements happen on the customer device but never reach Firestore
      // (settings writes are admin-only) → apply them here, once, on the admin side.
      const products=Repo.products.list(); let stockChanged=false;
      snap.forEach(d=>{ const v=(d.data()||{}).value; if(v&&v.id&&!orders.some(x=>x.id===v.id)){
        if(!v.stockApplied){
          (v.items||[]).forEach(i=>{ const pr=products.find(x=>x.id===i.productId); if(pr&&pr.stockCount!=null&&pr.stockCount!==""){
            pr.stockCount=Math.max(0,(parseInt(pr.stockCount)||0)-i.qty);
            if(pr.stockCount===0) pr.stockStatus="out_of_stock";
            else if(pr.stockCount<=5&&pr.stockStatus==="in_stock") pr.stockStatus="low_stock";
            stockChanged=true;
          } });
          v.stockApplied=true;
        }
        orders.push(v); merged++; } toDelete.push(d.id); });
      if(stockChanged) Repo.products.saveAll(products); // pushes pw_products
      if(merged) Repo.orders.saveAll(orders); // pushes pw_orders + re-syncs verifications
      for(const id of toDelete){ try{ await fs.deleteDoc(fs.doc(this.db,"orders_inbox",id)); }catch(e){} }
    }catch(e){}

  async submitMessage(m){

      await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","x-pw-token":token},body:JSON.stringify({public_id:pid})});
      return true;
    }catch(e){ return false; }
  }

/* Resource-tree compatibility helpers.
   Notes/MCQs/Past Papers use: Professional Year -> Semester -> Subject -> Section -> Topic -> Files.
   Lectures use: Professional Year -> Semester -> Subject -> Topic -> YouTube URL. */
function __rid(v){ return String(v||"item").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,42)||"item"; }
function __ensureNestedResourceTree(tree,kind){
  let changed=false;
  try{ (tree||[]).forEach(y=>{
    if(!Array.isArray(y.semesters)){y.semesters=[];changed=true;}
    y.semesters.forEach(se=>{
      if(!Array.isArray(se.subjects)){se.subjects=[];changed=true;}
      se.subjects.forEach(su=>{
        if(!Array.isArray(su.sections)){su.sections=[];changed=true;}
        /* MCQ v1 stored each PDF directly in su.topics. Convert once into a manual section. */
        if((kind==="mcqs"||kind==="notes") && su.sections.length===0 && Array.isArray(su.topics) && su.topics.length){
          su.sections=[{id:"mcqsec-"+__rid(su.id||su.label),title:kind==="notes"?"Study Notes":"MCQs",published:true,order:1,topics:su.topics.map((old,i)=>({
            id:"mcqtp-"+__rid(old.id||old.title||i),title:old.title||("Topic "+(i+1)),published:old.published!==false,order:i+1,updatedAt:old.updatedAt||new Date().toISOString(),files:old.pdfUrl?[{
              id:"mcqfile-"+__rid(old.id||i),title:old.title||("MCQ File "+(i+1)),pdfUrl:old.pdfUrl,downloads:old.downloads||0,published:old.published!==false,order:1,updatedAt:old.updatedAt||new Date().toISOString()
            }]:[]
          }))}]; changed=true;
        }
      });
    });
  }); }catch(e){}
  return {tree:tree||[],changed};
}
function __normalizePastPapers(raw){
  raw=Array.isArray(raw)?raw:[];
  /* Already in the new Professional -> Semester -> Subject tree. */
  if(!raw.length || raw.some(x=>Array.isArray(x.semesters))){
    const n=__ensureNestedResourceTree(raw,"papers");
    return n;
  }
  /* Legacy: University -> Professional Year -> Subject -> Papers.
     Keep a backup, then map University to Section and old papers to Files. */
  if(raw.some(x=>Array.isArray(x.years))){
    try{ if(!DB.get("pw_pastpapers_legacy_backup",null)) DB.set("pw_pastpapers_legacy_backup",JSON.parse(JSON.stringify(raw))); }catch(e){}
    const years=[];
    const getYear=label=>{
      let y=years.find(x=>x.label===label); if(y)return y;
      y={id:"ppyear-"+__rid(label),label:label||"Professional Year",order:years.length+1,semesters:[
        {id:"ppsem-"+__rid(label)+"-1",label:"Semester 1",order:1,subjects:[]},
        {id:"ppsem-"+__rid(label)+"-2",label:"Semester 2",order:2,subjects:[]}
      ]}; years.push(y); return y;
    };
    raw.forEach((u,ui)=>(u.years||[]).forEach((oy,yi)=>{
      const y=getYear(oy.label||("Professional "+(yi+1))), se=y.semesters[0];
      (oy.subjects||[]).forEach((osu,si)=>{
        let su=se.subjects.find(x=>x.label===osu.label);
        if(!su){su={id:"ppsub-"+__rid(osu.id||osu.label||si),label:osu.label||("Subject "+(si+1)),order:se.subjects.length+1,topics:[],sections:[]};se.subjects.push(su);}
        const sec={id:"ppsec-"+__rid((u.id||u.label||ui)+"-"+(osu.id||si)),title:u.label||"Imported Papers",published:true,order:su.sections.length+1,topics:[]};
        const tp={id:"pptp-"+__rid((u.id||ui)+"-"+(osu.id||si)),title:"Past Papers",published:true,order:1,files:[]};
        (osu.papers||[]).forEach((pp,pi)=>{
          const title=pp.title||(((pp.year||"")+" "+(pp.session||"Paper")).trim())||("Past Paper "+(pi+1));
          tp.files.push({id:"ppfile-"+__rid(pp.id||title||pi),title,pdfUrl:pp.pdfUrl||"",downloads:pp.downloads||0,published:pp.published!==false,order:pi+1,updatedAt:pp.updatedAt||new Date().toISOString()});
        });
        sec.topics.push(tp); su.sections.push(sec);
      });
    }));
    return {tree:years,changed:true};
  }
  return {tree:raw,changed:false};
}

/* uploadImage abstraction: Cloudinary when configured → base64 fallback */
function uploadImage(file,cb,maxKB){
  if(!file){ cb(null); return; }
  if(Cloud.cloud&&Cloud.cloud.cloudName&&Cloud.cloud.uploadPreset){
    toast("Uploading image…");
    Cloud.upload(file).then(url=>{ cb(url||null); if(url) toast("Image uploaded"); })
      .catch(e=>{ toast("Upload failed — kept locally","warn"); base64(); });
    return;
  }
  base64();
  function base64(){
    if(file.size>(maxKB||420)*1024 && !confirm("This image is over "+(maxKB||420)+" KB. Large base64 images fill local storage quickly. Continue?")){ cb(null); return; }
    const r=new FileReader(); r.onload=()=>cb(r.result); r.onerror=()=>cb(null); r.readAsDataURL(file);
  }
}

/* Unguessable public verification token (128-bit). Used in the invoice QR so
   orders can't be enumerated by sequential order number. */
function verifyToken(){
  try{
    const a=new Uint8Array(16); (crypto||window.crypto).getRandomValues(a);
    return "v_"+Array.from(a).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return "v_"+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2); }
}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg,type){
  const t=document.createElement("div"); t.className="toast "+(type||"ok");
  t.innerHTML=ic(type==="err"?"x":type==="warn"?"info":"check")+"<span>"+esc(msg)+"</span>";
  const host=$("#toasts"); host.appendChild(t);
  while(host.children.length>3) host.removeChild(host.firstChild);
  setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.remove(),300);},3400);
}
function sanitizeHtml(html){
  const tpl=document.createElement("template"); tpl.innerHTML=html||"";
  tpl.content.querySelectorAll("script,iframe:not([data-yt]),object,embed,link,style").forEach(n=>n.remove());
  tpl.content.querySelectorAll("*").forEach(n=>{[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||(a.name==="href"&&/^javascript:/i.test(a.value)))n.removeAttribute(a.name);});});
  return tpl.innerHTML;
}

function availStock(p){
  if(!p) return 0;
  if(p.stockStatus==="out_of_stock") return 0;
  if(p.stockCount==null||p.stockCount==="") return 9999;
  return Math.max(0,parseInt(p.stockCount)||0);
}

function ytId(url){
  url=String(url||"").trim();
  const pats=[
    /[?&]v=([\w-]{11})/,            // watch?v=ID
    /youtu\.be\/([\w-]{11})/,       // youtu.be/ID
    /\/embed\/([\w-]{11})/,         // /embed/ID
    /\/shorts\/([\w-]{11})/,        // /shorts/ID
    /\/live\/([\w-]{11})/,          // /live/ID
    /\/v\/([\w-]{11})/              // /v/ID
  ];
  for(const p of pats){ const m=p.exec(url); if(m) return m[1]; }
  // bare 11-char id
  if(/^[\w-]{11}$/.test(url)) return url;
  return "";
}
function ytEmbed(url){

const findYear=(t,y)=>t.find(x=>String(x.id)===String(y));
const findSem=(t,y,s)=>{const yy=findYear(t,y);return yy&&yy.semesters.find(x=>String(x.id)===String(s));};
const findSubj=(t,y,s,su)=>{const ss=findSem(t,y,s);return ss&&ss.subjects.find(x=>String(x.id)===String(su));};
const findTopic=(t,y,s,su,tp)=>{const q=findSubj(t,y,s,su);return q&&q.topics.find(x=>x.id===tp);};
const pubTopics=su=>(su.topics||[]).filter(t=>t.published!==false);
/* Notes v2: subject -> manually-created section -> topic -> file.
   Legacy flat su.topics data is preserved in storage but is no longer used by the Notes UI. */
const noteSectionsAll=su=>{ if(!Array.isArray(su.sections)) su.sections=[]; return su.sections; };
const pubNoteSections=su=>noteSectionsAll(su).filter(x=>x.published!==false);
const pubSectionTopics=sec=>(sec&&Array.isArray(sec.topics)?sec.topics:[]).filter(x=>x.published!==false);
const pubTopicFiles=tp=>(tp&&Array.isArray(tp.files)?tp.files:[]).filter(x=>x.published!==false);
const noteFileCount=su=>pubNoteSections(su).reduce((n,sec)=>n+pubSectionTopics(sec).reduce((m,tp)=>m+pubTopicFiles(tp).length,0),0);
const findNoteSection=(su,id)=>noteSectionsAll(su).find(x=>String(x.id)===String(id));
const findSectionTopic=(sec,id)=>(sec&&sec.topics||[]).find(x=>String(x.id)===String(id));
const findTopicFile=(tp,id)=>(tp&&tp.files||[]).find(x=>String(x.id)===String(id));
function driveFileId(url){
  url=String(url||"").trim();
  let m=url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
  m=url.match(/[?&]id=([a-zA-Z0-9_-]+)/); if(m) return m[1];
  m=url.match(/\/d\/([a-zA-Z0-9_-]+)/); return m?m[1]:"";
}
function filePreviewCandidates(url){
  url=String(url||" ").trim();const id=driveFileId(url);
  return id?["https://drive.google.com/file/d/"+encodeURIComponent(id)+"/preview"]:(url?[url]:[]);
}
function filePreviewUrl(url){ return filePreviewCandidates(url)[0]||""; }
function fileDownloadUrl(url){
  const id=driveFileId(url);
  const direct=id?("https://drive.usercontent.google.com/download?id="+encodeURIComponent(id)+"&export=download&confirm=t"):String(url||"").trim();
  const ep=(typeof window!=="undefined"&&window.PW_DOWNLOAD_ENDPOINT)||"";
  if(ep) return ep.replace(/\/$/,"")+(id?(("/"+encodeURIComponent(id))):((ep.includes("?")?"&":"?")+"url="+encodeURIComponent(direct)));
  if(id&&typeof location!=="undefined"&&/^https?:$/.test(location.protocol)) return "/download/"+encodeURIComponent(id);
  return direct;
}

/* A single registered academic router keeps all three libraries in sync. */
const ACADEMIC={notes:{title:'Notes',icon:'book',tag:'YOUR STUDY LIBRARY',intro:'Clear notes. Less searching. More learning.'},mcqs:{title:'MCQs',icon:'help',tag:'PRACTICE WITH PURPOSE',intro:'Build confidence, one topic at a time.'},special:{title:'Special Books & Notes',icon:'sparkles',tag:'SPECIAL STUDY RESOURCES',intro:'Guide books, special notes and general resources organised by subject.'},papers:{title:'Past Papers',icon:'clip',tag:'PREPARE FOR EXAM DAY',intro:'Know the pattern. Plan your preparation.'}};
const academicHref=(kind,...ids)=>'#/'+kind+(ids.length?'/'+ids.map(v=>encodeURIComponent(String(v))).join('/'):'');
const ordered=list=>(Array.isArray(list)?list:[]).filter(n=>n.published!==false).slice().sort((a,b)=>(a.order||0)-(b.order||0));
function academicEmpty(kind,missing=false){return '<div class="card empty academic-empty"><div class="glyph">'+ic(ACADEMIC[kind].icon)+'</div><h3>'+(missing?'This study item is unavailable':'Your library is getting ready')+'</h3><p>'+(missing?'It may have moved, or your saved data may need refreshing.':'Published resources will appear here as soon as they are available.')+'</p><div class="hero-cta"><a class="btn btn-primary" href="#/'+kind+'">Browse '+ACADEMIC[kind].title+'</a><button class="btn btn-ghost" onclick="PW.reloadAcademic(this)">'+ic('refresh')+'Refresh library</button></div></div>';}

function academicView(kind,p={}){
 const info=ACADEMIC[kind],tree=ordered(treeRepoOf(kind).getTree()),nodes=[],ids=[];
 let list=tree,level=0,parent=null;
 for(const key of ['y','s','sub','sec','tp']){
   if(p[key]==null)break;
   const n=list.find(v=>String(v.id)===String(p[key]));
   if(!n)return academicEmpty(kind,true);
   nodes.push(n);ids.push(n.id);parent=n;level++;
   list=ordered(level===1?n.semesters:level===2?n.subjects:level===3?n.sections:level===4?n.topics:n.files);
 }
 const linkFor=(depth)=>{const parts=ids.slice(0,depth);return depth>3?academicHref(kind,...parts.slice(0,3))+'/section/'+parts.slice(3).map(v=>encodeURIComponent(String(v))).join('/'):academicHref(kind,...parts);};
 const breadcrumbs=[{label:info.title,href:'#/'+kind},...nodes.map((n,i)=>({label:n.label||n.title||'Untitled',href:linkFor(i+1)}))];
 if(nodes.length)delete breadcrumbs[breadcrumbs.length-1].href;
 const steps=['Year','Semester','Subject','Section','Topic','Files'];
 const heading=parent?(parent.label||parent.title):info.title;
 const desc=level===0?info.intro:['','Choose your semester.','Choose a subject to continue.','Everything for this subject, organised into sections.','Choose a topic to see its resources.','Preview your files here, or download them for later.'][level];
 const rootCounts=tree.reduce((o,y)=>{ordered(y.semesters).forEach(se=>ordered(se.subjects).forEach(su=>{o.subjects++;o.files+=noteFileCount(su);}));return o;},{subjects:0,files:0});
 const head='<section class="academic-hero"><div><span class="eyebrow">'+info.tag+'</span><h1>'+esc(heading)+'</h1><p>'+esc(desc)+'</p></div><span class="academic-emblem">'+ic(info.icon,40)+'</span>'+(level===0?'<div class="academic-stats"><span><b>'+tree.length+'</b> professional years</span><span><b>'+rootCounts.subjects+'</b> subjects</span><span><b>'+rootCounts.files+'</b> files</span></div>':'')+'</section>';
 const tabs='<nav class="academic-tabs" aria-label="Study libraries">'+Object.entries(ACADEMIC).map(([key,v])=>'<a href="#/'+key+'" '+(kind===key?'aria-current="page"':'')+'>'+ic(v.icon)+v.title+'</a>').join('')+'</nav>';
 const trail='<ol class="study-steps" aria-label="Study progress">'+steps.map((step,i)=>'<li class="'+(i===level?'current':i<level?'done':'')+'" '+(i===level?'aria-current="step"':'')+'><span>'+(i<level?'✓':i+1)+'</span>'+step+'</li>').join('')+'</ol>';
 const toolbar='<div class="study-toolbar"><div class="study-heading"><p>'+esc(info.title+' / '+heading)+'</p><h2>'+(['Choose your year','Choose a semester','Subjects','Sections','Topics','Files'][level])+' <small>'+list.length+'</small></h2></div><label class="study-search">'+ic('search')+'<input type="search" placeholder="Search '+steps[level].toLowerCase()+'…" aria-label="Search this list" oninput="PW.filterStudy(this.value)"></label></div>';
 let cards='';
 if(level===5){cards=list.map((f,i)=>{const args=esc([kind,...ids,f.id].map(v=>JSON.stringify(String(v))).join(','));return '<button class="study-card study-file" data-label="'+esc((f.title||'File').toLowerCase())+'" onclick="PW.openNestedResourceFile('+args+')"><span class="study-icon">'+ic('file')+'</span><span class="study-copy"><small>RESOURCE '+(i+1)+'</small><b>'+esc(f.title||'File')+'</b><span>'+(f.updatedAt?'Updated '+dateFmt(f.updatedAt):'Ready to read')+'</span></span><span class="file-open">'+ic('eye')+'Open</span></button>';}).join('');}
 else{cards=list.map((n,i)=>{let href=level===3?linkFor(3)+'/section/'+encodeURIComponent(String(n.id)):level===4?linkFor(4)+'/'+encodeURIComponent(String(n.id)):academicHref(kind,...ids,n.id);let detail=level===0?ordered(n.semesters).length+' semesters':level===1?ordered(n.subjects).length+' subjects':level===2?pubNoteSections(n).length+' sections · '+noteFileCount(n)+' files':level===3?pubSectionTopics(n).length+' topics':pubTopicFiles(n).length+' files';return academicCard(n.label||n.title||'Untitled',detail,href,level<2?'book':level===4?'file':info.icon,i);}).join('');}
 return '<div class="academic-page"><div class="academic-controls" data-section-tools>'+tabs+(nodes.length?crumbs(breadcrumbs):'')+head+trail+'</div>'+toolbar+(list.length?'<div class="study-grid" id="studyList">'+cards+'</div><p id="studyNoResults" class="study-no-results" hidden>No matches. Try another word.</p>':academicEmpty(kind))+'</div>';
}

 for(const suffix of ['', '/:y','/:y/:s','/:y/:s/:sub','/:y/:s/:sub/section/:sec','/:y/:s/:sub/section/:sec/:tp'])route('/'+kind+suffix,p=>sectionEnabled(kind)?academicView(kind,p):sectionUnavailable(ACADEMIC[kind].title));
