/* Public order verification — this is what the invoice QR opens.
   Works same-device via localStorage; when Firebase is connected it fetches
   the order from Firestore so any phone that scans it can verify online. */
route("/verify/:n",p=>{
  // match by unguessable token first, then fall back to orderNumber (legacy links)
  const localMatch=()=>Repo.orders.list().find(x=>x.verifyToken===p.n)||Repo.orders.list().find(x=>x.orderNumber===p.n);
  const o=localMatch();
  // Same-device order already present → show it immediately, no waiting.
  if(o) return '<div id="verifyHost">'+verifyReceipt(o)+'</div>';

  // Firebase is expected to hold the record. We must NOT render "not found"
  // until the verification request has actually completed. While Firebase is
  // still connecting (Cloud.ready === false) or the fetch is in flight, keep
  // showing the loading state. Only a completed lookup decides the result.
  // Firebase may not have finished init() yet (Cloud.cfg is set there), so detect
  // cloud usage from the static config that's available synchronously at load.
  const usesCloud=FIREBASE_CONFIGURED||!!(Cloud.cfg&&Cloud.cfg.apiKey);
  if(usesCloud){
    window.__afterRender=async()=>{
      const host=()=>$("#verifyHost");
      // 1) Wait for Firebase to finish initialising (bounded).
      const start=Date.now(), MAX_WAIT=12000;
      while(!Cloud.ready && (Date.now()-start)<MAX_WAIT){
        await new Promise(r=>setTimeout(r,150));
      }
      // A same-device pull may have landed while we waited.
      const late=localMatch();
      if(late){ if(host()) host().innerHTML=verifyReceipt(late); return; }
      if(!Cloud.ready){
        // Firebase never came up in time → this is a genuine network problem,
        // not a "receipt doesn't exist" answer. Show a retryable network error.
        if(host()) host().innerHTML=verifyNetworkError(p.n);
        return;
      }
      // 2) Firebase is ready → perform the real verification request.
      try{
        const fs=Cloud._fs;
        let found=null;
        // Read the PUBLIC, PII-minimized verification doc keyed by token — not the private order.
        const d=await fs.getDoc(fs.doc(Cloud.db,"verifications",p.n));
        if(d.exists()) found=d.data();
        if(!found){
          // legacy links may pass an orderNumber → scan public docs as a fallback
          try{
            const snap=await fs.getDocs(fs.collection(Cloud.db,"verifications"));
            snap.forEach(doc=>{ const v=doc.data(); if(!found&&v&&v.orderNumber===p.n) found=v; });
          }catch(e){}
        }
        if(!host()) return;                 // user navigated away
        if(found) host().innerHTML=verifyReceipt(found,true);
        else host().innerHTML=verifyNotFound(p.n);   // request completed, truly absent
      }catch(e){
        if(host()) host().innerHTML=verifyNetworkError(p.n);
      }
    };
    return '<div id="verifyHost">'+verifyChecking()+'</div>';
  }
  // No cloud configured and no local match → nothing can verify this link.
  return '<div id="verifyHost">'+verifyNotFound(p.n)+'</div>';
});

// Map any legacy/order status onto the world-standard receipt set.
function normalizeReceiptStatus(s){
  if(RECEIPT_STATUS_META[s]) return s;
  const legacy={Confirmed:"Processing",Packed:"Processing",Dispatched:"Processing",Delivered:"Completed",Rejected:"Cancelled",Unpaid:"Pending"};
  return legacy[s]||"Pending";
}

function searchIndex(){
  const out=[];
  const indexNested=(kind,base,label,icon)=>treeRepoOf(kind).getTree().forEach(y=>(y.semesters||[]).forEach(se=>(se.subjects||[]).forEach(su=>{
    const subBase=base+"/"+[y.id,se.id,su.id].map(v=>encodeURIComponent(String(v))).join("/");
    out.push({kind:label,icon,label:su.label,path:y.label+" › "+se.label,href:subBase});
    pubNoteSections(su).forEach(sec=>{
      const secHref=subBase+"/section/"+encodeURIComponent(String(sec.id));out.push({kind:label,icon,label:sec.title,path:y.label+" › "+se.label+" › "+su.label,href:secHref});
      pubSectionTopics(sec).forEach(tp=>{const tpHref=secHref+"/"+encodeURIComponent(String(tp.id));out.push({kind:"Topics",icon:"file",label:tp.title,path:y.label+" › "+se.label+" › "+su.label+" › "+sec.title,href:tpHref});pubTopicFiles(tp).forEach(f=>out.push({kind:"Files",icon:"file",label:f.title,path:y.label+" › "+se.label+" › "+su.label+" › "+sec.title+" › "+tp.title,href:tpHref}));});
    });
  })));
  if(sectionEnabled("notes"))indexNested("notes","#/notes","Notes","book");
  if(sectionEnabled("mcqs"))indexNested("mcqs","#/mcqs","MCQs","help");
  if(sectionEnabled("special"))indexNested("special","#/special","Special Books & Notes","sparkles");
  if(sectionEnabled("papers"))indexNested("papers","#/papers","Past Papers","clip");
  if(sectionEnabled("shop"))Repo.products.list().filter(p=>!p.hidden).forEach(p=>out.push({kind:"Products",icon:"pkg",label:p.name,path:p.category+" · "+money(p.price),href:"#/shop/"+p.id}));
  if(sectionEnabled("about"))Repo.blogs.list().filter(b=>b.status==="published").forEach(b=>out.push({kind:"Blogs",icon:"file",label:b.title,path:b.excerpt,href:"#/blogs/"+b.slug}));
  return out;
}

function fuzzy(q,s){
  q=q.toLowerCase(); s=(s||"").toLowerCase();
  if(s.includes(q)) return 2+(s.startsWith(q)?1:0);
  let i=0; for(const ch of s){ if(ch===q[i]) i++; if(i===q.length) return 1; }
  return 0;
}
function runSearch(q){
  const box=$("#searchResults");
  if(!q||q.length<2){ box.innerHTML='<p class="small faint" style="text-align:center;margin-top:24px">Type at least 2 characters</p>'; return; }
  const hits=searchIndex().map(it=>({...it,score:Math.max(fuzzy(q,it.label),fuzzy(q,it.path)*.6)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  if(!hits.length){ box.innerHTML='<div class="empty"><div class="glyph">'+ic("search")+'</div><p>No results for "'+esc(q)+'"</p></div>'; return; }
  const groups={};
  hits.slice(0,30).forEach(h=>{(groups[h.kind]=groups[h.kind]||[]).push(h);});
  box.innerHTML=Object.entries(groups).map(([k,items])=>'<div class="sr-group"><h4>'+k+' · '+items.length+'</h4>'+items.map(i=>'<a class="sr-item" href="'+i.href+'" onclick="PW.closeSearch()">'+ic(i.icon)+'<span><b>'+esc(i.label)+'</b><span class="path">'+esc(i.path)+'</span></span></a>').join("")+'</div>').join("");
}

function biType(v){

  if(["lecture","lectures","video","videos","youtube","youtubelecture"].includes(x))return "lectures";
  return null;
}
function biSectionFromType(v){
  const x=biHdr(v);
  if(["specialbook","specialbooks"].includes(x))return "Special Books";
  if(["guidenote","guidenotes","guidebook","guidebooks","studyguide","studyguides"].includes(x))return "Guide Notes";
  if(["generalnote","generalnotes","specialnotes","special"].includes(x))return "General Notes";
  if(["book","books","textbook","textbooks"].includes(x))return "Books";
  if(["slide","slides","ppt","presentation","presentations"].includes(x))return "Slides";
  if(["assignment","assignments"].includes(x))return "Assignments";
  if(["practical","practicals"].includes(x))return "Practicals";

function biNormalizeRow(raw,idx,defType){

function biCsvObjects(text){
  text=String(text||"").replace(/^\uFEFF/,""); const rows=[]; let row=[],cell="",quoted=false;

    const c=text[i],n=text[i+1];

    else if(c==='"')quoted=true; else if(c===','){row.push(cell);cell="";} else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell="";} else if(c!=='\r')cell+=c;
  }

function biExpandJsonItem(item,inherited){

function biJsonRows(data){

async function biReadFile(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(file.size>25*1024*1024)throw new Error("File is larger than 25 MB. Split it into smaller imports.");
  if(ext==="json")return biJsonRows(JSON.parse(await file.text()));
  if(ext==="csv")return biCsvObjects(await file.text());
  if(ext==="xlsx"||ext==="xls"){
    const XLSX=await biLoadXLSX(),wb=XLSX.read(await file.arrayBuffer(),{type:"array"}),out=[];
    wb.SheetNames.forEach(name=>{const arr=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:"",raw:false});arr.forEach(r=>{r.__sheet=name;out.push(r);});}); return out;
  }
  throw new Error("Unsupported format. Use JSON, CSV, XLSX or XLS.");
}

let dmState={kind:"notes",level:"section",query:""};
function dmLevels(kind){return kind==="lectures"?["year","semester","subject","topic"]:["year","semester","subject","section","topic","file"];}
function dmLevelLabel(x){return ({year:"Professional Year",semester:"Semester",subject:"Subject",section:"Section",topic:"Topic",file:"File"})[x]||x;}
function dmKey(kind,level,ids){return encodeURIComponent(JSON.stringify({kind,level,ids}));}
function dmDecode(key){try{return JSON.parse(decodeURIComponent(key));}catch(e){return null;}}
function dmRows(kind,level){
  const tree=treeRepoOf(kind).getTree(),rows=[];
  (tree||[]).forEach(y=>{
    if(level==="year")rows.push({key:dmKey(kind,level,[y.id]),label:y.label,path:kindLabel(kind)});
    (y.semesters||[]).forEach(se=>{
      if(level==="semester")rows.push({key:dmKey(kind,level,[y.id,se.id]),label:se.label,path:y.label});
      (se.subjects||[]).forEach(su=>{
        if(level==="subject")rows.push({key:dmKey(kind,level,[y.id,se.id,su.id]),label:su.label,path:y.label+' › '+se.label});
        if(kind==="lectures"){
          (su.topics||[]).forEach(tp=>{if(level==="topic")rows.push({key:dmKey(kind,level,[y.id,se.id,su.id,tp.id]),label:tp.title,path:y.label+' › '+se.label+' › '+su.label});});
        }else{
          noteSectionsAll(su).forEach(sec=>{
            if(level==="section")rows.push({key:dmKey(kind,level,[y.id,se.id,su.id,sec.id]),label:sec.title,path:y.label+' › '+se.label+' › '+su.label});
            (sec.topics||[]).forEach(tp=>{
              if(level==="topic")rows.push({key:dmKey(kind,level,[y.id,se.id,su.id,sec.id,tp.id]),label:tp.title,path:y.label+' › '+se.label+' › '+su.label+' › '+sec.title});
              (tp.files||[]).forEach(f=>{if(level==="file")rows.push({key:dmKey(kind,level,[y.id,se.id,su.id,sec.id,tp.id,f.id]),label:f.title,path:y.label+' › '+se.label+' › '+su.label+' › '+sec.title+' › '+tp.title});});
            });
          });
        }
      });
    });
  });
  const q=biNorm(dmState.query);return q?rows.filter(r=>biNorm(r.label+' '+r.path).includes(q)):rows;
}

function dmRemoveOne(desc,tree){
  if(!desc||!tree)return false;const ids=desc.ids||[],y=tree.find(x=>x.id===ids[0]);if(!y)return false;
  if(desc.level==="year"){const i=tree.indexOf(y);if(i>=0){tree.splice(i,1);return true;}return false;}
  const se=(y.semesters||[]).find(x=>x.id===ids[1]);if(!se)return false;
  if(desc.level==="semester"){y.semesters=(y.semesters||[]).filter(x=>x.id!==se.id);return true;}
  const su=(se.subjects||[]).find(x=>x.id===ids[2]);if(!su)return false;
  if(desc.level==="subject"){se.subjects=(se.subjects||[]).filter(x=>x.id!==su.id);return true;}
  if(desc.kind==="lectures"){
    if(desc.level==="topic"){const before=(su.topics||[]).length;su.topics=(su.topics||[]).filter(x=>x.id!==ids[3]);return su.topics.length<before;}return false;
  }
  const sec=noteSectionsAll(su).find(x=>x.id===ids[3]);if(!sec)return false;
  if(desc.level==="section"){su.sections=noteSectionsAll(su).filter(x=>x.id!==sec.id);return true;}
  const tp=(sec.topics||[]).find(x=>x.id===ids[4]);if(!tp)return false;
  if(desc.level==="topic"){sec.topics=(sec.topics||[]).filter(x=>x.id!==tp.id);return true;}
  if(desc.level==="file"){const before=(tp.files||[]).length;tp.files=(tp.files||[]).filter(x=>x.id!==ids[5]);return tp.files.length<before;}return false;
}

const prodSubcat=p=>p.subcategory||"General";

function normalizeProducts(rows,existing=Repo.products.list()){
 const keys=new Set(existing.map(p=>[p.name,p.category||'General',p.subcategory||'General'].map(biNorm).join('|')));
 return rows.filter(r=>Object.values(r).some(v=>String(v??'').trim())).map((raw,i)=>{
  const value=(...names)=>biTxt(biPick(raw,names)),name=value('name','productname','title'),category=value('category')||'General',subcategory=value('subcategory')||'General';
  const price=Number(value('price')),stockText=value('stock','stockcount','quantity'),stock=Number(stockText||0),image=value('image','imageurl');
  const errors=[];if(!name)errors.push('Product name required');if(!Number.isFinite(price)||price<=0)errors.push('Price must be greater than zero');if(!Number.isInteger(stock)||stock<0)errors.push('Stock must be a whole number, zero or more');if(image&&!/^https?:\/\//i.test(image))errors.push('Image must be an http(s) URL');
  const key=[name,category,subcategory].map(biNorm).join('|');if(keys.has(key))errors.push('Already exists or repeated in this batch');if(!errors.length)keys.add(key);
  return {row:i+1,errors,product:{name,category,subcategory,price,stockCount:stock,stockStatus:stock>0?'in_stock':'out_of_stock',images:image?[image]:[],shortDesc:value('description','shortdesc'),fullDescHtml:'',variants:[],hidden:false,featured:false,compareAtPrice:0}};
 });
}

ction>':'')+'<section class="batch-existing"><div class="section-title"><h3>Manage all products</h3></div><div class="batch-actions"><label><input type="checkbox" onchange="document.querySelectorAll(\'[data-product-delete]\').forEach(x=>x.checked=this.checked)"> Select all</label><button class="btn btn-danger btn-sm" onclick="PW.productBatchDelete()">'+ic('trash')+'Delete selected</button></div><div class="drill">'+Repo.products.list().map(p=>'<label class="batch-existing-row"><input type="checkbox" data-product-delete value="'+esc(p.id)+'"><span><b>'+esc(p.name)+'</b><small>'+esc(p.category||'General')+' · '+money(p.price)+'</small></span></label>').join('')+'</div></section>',{title:'Bulk products',crumbs:[{label:'Dashboard',href:'#/admin'},{label:'Products',href:'#/admin/products'},{label:'Bulk create & delete'}]});

function modal(html){ $("#modalHost").innerHTML='<div class="overlay" onclick="if(event.target===this)PW.closeModal()"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>'; }

/* Reusable modal-based prompt/confirm — reliable on every mobile browser
   (native prompt()/confirm() are blocked in many in-app webviews). */
let __askCb=null, __confirmCb=null;
function askModal(opts){
  __askCb=opts.onSubmit||null;
  modal(`<div class="mhead"><h3>${esc(opts.title||"Enter value")}</h3><button class="x" onclick="PW.closeModal()" aria-label="Close">${ic("close")}</button></div>
    <div class="mbody"><div class="field"><label>${esc(opts.label||"Value")}</label>
      <input id="askInput" value="${esc(opts.value||"")}" placeholder="${esc(opts.placeholder||"")}" autocomplete="off"></div></div>
    <div class="mfoot"><button class="btn btn-ghost btn-sm" onclick="PW.closeModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="PW.askSubmit()">${esc(opts.ok||"Save")}</button></div>`);
  setTimeout(()=>{const i=$("#askInput"); if(i){ i.focus(); i.select(); i.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();PW.askSubmit();} }; }},60);
}
function confirmModal(opts){
  __confirmCb=opts.onConfirm||null;
  modal(`<div class="mhead"><h3>${esc(opts.title||"Are you sure?")}</h3><button class="x" onclick="PW.closeModal()" aria-label="Close">${ic("close")}</button></div>
    <div class="mbody"><p class="small" style="color:var(--ink-2);line-height:1.6">${esc(opts.message||"")}</p></div>
    <div class="mfoot"><button class="btn btn-ghost btn-sm" onclick="PW.closeModal()">Cancel</button>
      <button class="btn ${opts.danger?"btn-danger":"btn-primary"} btn-sm" onclick="PW.confirmYes()">${esc(opts.ok||"Confirm")}</button></div>`);
}

const treeRepoOf=k=>k==="notes"?Repo.notes:k==="special"?Repo.special:k==="mcqs"?Repo.mcqs:k==="papers"?Repo.pastpapers:Repo.lectures;
function locate(kind,ids){
  const tree=treeRepoOf(kind).getTree();
  const y=tree.find(x=>x.id===ids[0]);
  const s=y&&y.semesters.find(x=>x.id===ids[1]);
  const su=s&&s.subjects.find(x=>x.id===ids[2]);
  const t=su&&su.topics.find(x=>x.id===ids[3]);
  return {tree,y,s,su,t};
}

  addToCart(id,qty,variant){
    qty=Math.max(1,parseInt(qty)||1); variant=variant||"";
    const p=Repo.products.list().find(x=>String(x.id)===String(id)); if(!p) return;
    const avail=availStock(p);
    if(avail<=0){ toast("Out of stock","err"); return; }
    const cart=Repo.cart.get();
    const inCart=cart.filter(i=>i.productId===id).reduce((s,i)=>s+i.qty,0);
    if(inCart+qty>avail){ toast("Only "+avail+" in stock","warn"); return; }
    const ex=cart.find(i=>i.productId===id&&(i.variant||"")===variant);
    if(ex) ex.qty+=qty; else cart.push({productId:id,name:p.name,qty,price:p.price,variant});
    Repo.cart.save(cart); renderCartBadges(); toast("Added to cart");
  },
  buyNow(id,qty,variant){
    qty=Math.max(1,parseInt(qty)||1);
    const p=Repo.products.list().find(x=>String(x.id)===String(id)); if(!p)return;
    if(availStock(p)<qty){ toast(availStock(p)<=0?"Out of stock":"Only "+availStock(p)+" in stock","err"); return; }
    Repo.cart.save([{productId:id,name:p.name,qty,price:p.price,variant:variant||""}]);
    checkoutOrderNo=null; location.hash="#/checkout";
  },

    const cart=Repo.cart.get(); const it=cart.find(i=>i.productId===id&&(i.variant||"")===(variant||"")); if(!it)return;

      const p=Repo.products.list().find(x=>String(x.id)===String(id)); const avail=p?availStock(p):9999;

  recalcDelivery(){
    const form=$("#coForm"); if(!form)return;
    const d=Repo.delivery.get();
    const sub=Repo.cart.get().reduce((s,i)=>s+i.price*i.qty,0);
    const del=sub>=d.freeDeliveryThreshold?0:(d.provinceRates[form.province.value]??d.defaultCharge);
    $("#coDel").textContent=del===0?"Free":money(del);
    $("#coTot").textContent=money(sub+del);

  placeOrder(){
    const form=$("#coForm"); let ok=true;
    form.querySelectorAll(".field").forEach(f=>{
      const inp=f.querySelector("input[required],select[required]"); if(!inp) return;
      const valid=inp.checkValidity()&&inp.value.trim();
      f.classList.toggle("invalid",!valid); if(!valid) ok=false;
    });
    if(!ok){ toast("Please complete the required fields","err"); return; }
    const cart=Repo.cart.get();
    if(!cart.length){ toast("Your cart is empty","err"); return; }
    // Re-validate stock right before committing (guards against stale carts / sold-out items)
    const products=Repo.products.list();
    const wanted={}; cart.forEach(i=>wanted[i.productId]=(wanted[i.productId]||0)+i.qty);
    for(const pid of Object.keys(wanted)){
      const p=products.find(x=>x.id===pid);
      if(!p){ toast('An item in your cart is no longer available','err'); return; }
      const avail=availStock(p);
      if(avail<=0){ toast('"'+p.name+'" just went out of stock','err'); render(); return; }
      if(wanted[pid]>avail){ toast('Only '+avail+' of "'+p.name+'" left — please adjust your cart','err'); return; }
    }
    const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
    const del=window.__coDel??Repo.delivery.get().defaultCharge;
    const sess=Repo.session.get();
    const order={
      id:uid("ord"), orderNumber:checkoutOrderNo, verifyToken:verifyToken(),
      items:cart.map(i=>({productId:i.productId,name:i.name+(i.variant?" ("+i.variant+")":""),qty:i.qty,price:i.price})),
      customer:{firstName:form.firstName.value.trim(),lastName:form.lastName.value.trim(),phone:form.phone.value.trim(),phoneSecondary:form.phoneSecondary.value.trim(),email:(sess&&sess.email)||""},
      address:{line1:form.address.value.trim(),city:form.city.value.trim(),province:form.province.value,deliveryAddress:form.deliveryAddress.value.trim(),notes:form.notes.value.trim()},
      totals:{subtotal:sub,delivery:del,grandTotal:sub+del},
      status:"Pending",payment:"Unpaid",createdAt:new Date().toISOString()
    };
    // Decrement stock immediately; auto-flag out-of-stock at zero
    cart.forEach(i=>{
      const p=products.find(x=>x.id===i.productId); if(!p) return;
      if(p.stockCount!=null&&p.stockCount!==""){
        p.stockCount=Math.max(0,(parseInt(p.stockCount)||0)-i.qty);
        if(p.stockCount===0) p.stockStatus="out_of_stock";
        else if(p.stockCount<=5&&p.stockStatus==="in_stock") p.stockStatus="low_stock";
      }
    });
    Repo.products.saveAll(products);
    const orders=Repo.orders.list(); orders.push(order); Repo.orders.saveAll(orders);
    Cloud.submitOrder(order); // reaches admin + enables QR verification for customers
    Repo.cart.save([]); renderCartBadges(); const n=checkoutOrderNo; checkoutOrderNo=null;
    toast("Order received"); location.hash="#/order-success/"+n;
  },

  /* ---- auth (hidden admin check inside normal login) ---- */
  _loginBusy:false,
  async doLogin(){
    // Rate-limit / debounce: block re-entry until the current attempt resolves.
    if(this._loginBusy) return;
    const f=$("#loginForm"); if(!f) return;
    const u=f.email.value.trim(); const p=f.password.value;
    if(!u||!p){ toast("Enter your credentials","err"); return; }
    this._loginBusy=true;
    const btn=f.querySelector('button.btn-primary');
    if(btn){ btn.disabled=true; btn.dataset.label=btn.innerHTML; btn.innerHTML="Signing In…"; }
    showSigningOverlay();
    // Cleanup helper: hide overlay + re-enable the button (used on every failure path).
    const fail=(msg)=>{ hideSigningOverlay(); this._loginBusy=false; if(btn){ btn.disabled=false; btn.innerHTML=btn.dataset.label||"Log in"; } if(msg) toast(msg,"err"); };
    try{
      // Admins authenticate against Firebase Auth; the account must match the
      // configured admin UID (enforced again by Firestore security rules).
      if(Cloud.ready){
        const uid=await Cloud.signInAdmin(u,p);
        if(uid){
          if(uid===Cloud.adminUid){
            Repo.session.save({role:"admin",username:u,uid,issuedAt:new Date().toISOString(),expiresAt:new Date(Date.now()+12*3600e3).toISOString()});
            Cloud.isAdmin=true; await Cloud.pullPrivate();
            hideSigningOverlay(); this._loginBusy=false;
            toast("Welcome back, Admin");
            showAdminWelcome();               // premium overlay, non-blocking
            location.hash="#/admin"; render(); // dashboard loads immediately underneath
            return;
          }
          await Cloud.signOut(); fail("This account is not an administrator"); return;
        }
        // not a Firebase user → fall through to local student login
      }
      const s=Repo.auth.loginUser(u,p);
      if(s){ hideSigningOverlay(); this._loginBusy=false; toast("Logged in"); location.hash="#/account"; }
      else fail("Invalid email or password");
    }catch(e){ fail("Sign-in failed — please try again"); }
  },
  doSignup(){
    const f=$("#signupForm"); const v=n=>f[n].value.trim();
    if(!v("firstName")||!v("lastName")||!v("email")||!v("phone")||!f.password.value){ toast("Please fill all required fields","err"); return; }
    if(f.password.value!==f.confirm.value){ toast("Passwords do not match","err"); return; }
    const users=Repo.users.list();
    if(users.some(u=>u.email.toLowerCase()===v("email").toLowerCase())){ toast("An account with this email already exists","err"); return; }
    users.push({id:uid("usr"),firstName:v("firstName"),lastName:v("lastName"),email:v("email"),phone:v("phone"),passwordHash:f.password.value,createdAt:new Date().toISOString()});
    Repo.users.saveAll(users);
    Repo.auth.loginUser(v("email"),f.password.value);
    toast("Welcome to the Pharm-D with Hyzen family"); location.hash="#/account";
  },

      onConfirm:()=>{

        let uni=tree.find(u=>u.importBucket);
        const done=new Set(); tree.forEach(u=>(u.years||[]).forEach(y=>(y.subjects||[]).forEach(su=>(su.papers||[]).forEach(x=>{ if(x.srcId) done.add(x.srcId); }))));
        let added=0;
        Repo.notes.getTree().forEach(ny=>ny.semesters.forEach(ns=>ns.subjects.forEach(nsu=>{
          const papers=nsu.topics.filter(t=>(t.contentType||"Notes")==="Past Paper");
          if(!papers.length) return;
          if(!uni){ uni={id:uid("uni"),label:"Imported from Notes",importBucket:true,order:tree.length+1,years:[]}; tree.push(uni); }
          let y=uni.years.find(x=>x.label===ny.label); if(!y){ y={id:uid("py"),label:ny.label,order:uni.years.length+1,subjects:[]}; uni.years.push(y); }

  /* WhatsApp-style circular crop: zoom slider + drag to reposition */
  cropOpen(dataUrl,onDone){
    const old=document.getElementById("cropOverlay"); if(old) old.remove();
    const ov=document.createElement("div"); ov.id="cropOverlay";
    ov.innerHTML=`<div class="crop-box">
      <h4 style="margin:0 0 10px;font-size:15px">Adjust your photo</h4>
      <p class="small faint" style="margin:0 0 12px">Drag to move · slide to zoom. The circle shows exactly what will be visible.</p>
      <div class="crop-vp" id="cropVp"><img id="cropImg" src="${dataUrl}" alt="" draggable="false"><div class="crop-mask"></div></div>
      <input id="cropZoom" type="range" min="100" max="400" value="100" style="width:100%;margin:14px 0 6px" aria-label="Zoom">
      <div class="mfoot" style="margin-top:8px"><button class="btn btn-ghost btn-sm" onclick="PW.cropCancel()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="PW.cropSave()">Use photo</button></div></div>`;
    document.body.appendChild(ov);
    const img=$("#cropImg"), vp=$("#cropVp");
    const st=window.__crop={onDone,x:0,y:0,scale:1,min:1,natW:0,natH:0,drag:null};
    img.onload=()=>{
      st.natW=img.naturalWidth; st.natH=img.naturalHeight;
      const vpSize=vp.clientWidth;
      st.min=vpSize/Math.min(st.natW,st.natH); st.scale=st.min;
      $("#cropZoom").oninput=e=>{ st.scale=st.min*(parseInt(e.target.value)/100); PW.cropClamp(); PW.cropApply(); };
      PW.cropClamp(); PW.cropApply();
    };
    const start=(cx,cy)=>{ st.drag={sx:cx,sy:cy,ox:st.x,oy:st.y}; };
    const move=(cx,cy)=>{ if(!st.drag) return; st.x=st.drag.ox+(cx-st.drag.sx); st.y=st.drag.oy+(cy-st.drag.sy); PW.cropClamp(); PW.cropApply(); };
    vp.addEventListener("mousedown",e=>{e.preventDefault();start(e.clientX,e.clientY);});
    window.addEventListener("mousemove",e=>move(e.clientX,e.clientY));
    window.addEventListener("mouseup",()=>{st.drag=null;});
    vp.addEventListener("touchstart",e=>{ if(e.touches.length===1){ start(e.touches[0].clientX,e.touches[0].clientY); } },{passive:true});
    vp.addEventListener("touchmove",e=>{ if(e.touches.length===1&&st.drag){ e.preventDefault(); move(e.touches[0].clientX,e.touches[0].clientY); } },{passive:false});
    vp.addEventListener("touchend",()=>{st.drag=null;});
  },
  cropClamp(){
    const st=window.__crop; const vp=$("#cropVp"); if(!st||!vp) return;
    const size=vp.clientWidth, w=st.natW*st.scale, h=st.natH*st.scale;
    const maxX=Math.max(0,(w-size)/2), maxY=Math.max(0,(h-size)/2);
    st.x=Math.min(maxX,Math.max(-maxX,st.x)); st.y=Math.min(maxY,Math.max(-maxY,st.y));
  },
  cropApply(){
    const st=window.__crop; const img=$("#cropImg"); if(!st||!img) return;
    img.style.transform=`translate(calc(-50% + ${st.x}px),calc(-50% + ${st.y}px)) scale(${st.scale})`;
  },
  cropCancel(){ const ov=document.getElementById("cropOverlay"); if(ov) ov.remove(); window.__crop=null; },
  cropSave(){
    const st=window.__crop; const img=$("#cropImg"), vp=$("#cropVp"); if(!st||!img) return;
    const size=vp.clientWidth, out=512;
    const cv=document.createElement("canvas"); cv.width=out; cv.height=out;
    const ctx=cv.getContext("2d");
    // viewport top-left in image source coordinates
    const offX=size/2+st.x-(st.natW*st.scale)/2, offY=size/2+st.y-(st.natH*st.scale)/2;
    const sx=(0-offX)/st.scale, sy=(0-offY)/st.scale, sw=size/st.scale;
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,out,out);
    ctx.drawImage(img,sx,sy,sw,sw,0,0,out,out);
    const dataUrl=cv.toDataURL("image/jpeg",0.86);
    const done=st.onDone; PW.cropCancel();
    // upload cropped square through the normal pipeline (Cloudinary or base64 fallback)
    try{
      const bin=atob(dataUrl.split(",")[1]); const arr=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      const file=new File([arr],"avatar.jpg",{type:"image/jpeg"});
      uploadImage(file,url=>done(url||dataUrl),420);
    }catch(e){ done(dataUrl); }
  },

/* Mobile zoom lock — iOS Safari ignores user-scalable=no, so block gestures in JS.
   These listeners only fire on touch input, so desktop mouse / ctrl-wheel zoom is untouched. */
/* boot sequence runs in the async IIFE at the end of the file */
/* ambient grid particles — lightweight, respects reduced motion */
(function(){
  const host=document.getElementById("bgParticles"); if(!host) return;
  const rm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(rm||window.innerWidth<=768) return;
  const n=16;
  for(let i=0;i<n;i++){
    const p=document.createElement("span"); p.className="p";
    p.style.left=Math.random()*100+"vw";
    p.style.bottom=(-10-Math.random()*20)+"vh";
    const dur=16+Math.random()*20;
    p.style.animationDuration=dur+"s";
    p.style.animationDelay=(-Math.random()*dur)+"s";
    const sz=2+Math.random()*2.5; p.style.width=p.style.height=sz+"px";
    host.appendChild(p);
  }
})();

document.addEventListener('visibilitychange',()=>Notices.maybe());window.addEventListener('focus',()=>Notices.maybe());
SectionChrome.init();sizeViewport();
document.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.shiftKey&&(e.key==="A"||e.key==="a")){ e.preventDefault(); location.hash="#/login"; }
  if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!document.activeElement.isContentEditable){ e.preventDefault(); PW.openSearch(); }
  if(Notices.open){if(e.key==='Escape'){e.preventDefault();PW.dismissNotice();}if(e.key==='Tab'){const all=Array.from(document.querySelectorAll('#noticeHost button,#noticeHost a')),first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}return;}
  if(Tour.active){if(e.key==='Escape'){e.preventDefault();Tour.finish();}if(e.key==='Tab'){const target=Tour.target,controls=target?[target,...target.querySelectorAll('a,button,input,textarea,select')].filter(el=>el.matches('a,button,input,textarea,select')&&!el.inert):[],all=[...controls,...document.querySelectorAll('#tourHost button')],first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}return;}
  if(e.key==="Escape"){if(admDrawerOpen){PW.admDrawer(false);return;}PW.radialSet(false); PW.closeSearch(); PW.closeModal();}
  if(e.key==='Tab'&&admDrawerOpen){const all=Array.from(document.querySelectorAll('#admSidebar a,#admSidebar button')),first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  if(e.key==="Tab" && $("#radialDock").classList.contains("open")){
    const focusables=Array.from($("#radialDock").querySelectorAll('a,button'));
    const first=focusables[0],last=focusables[focusables.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});
$("#searchInput").addEventListener("input",e=>runSearch(e.target.value));

/* ---------------- Boot: splash → wait for Firebase → render (no demo flash) --- */
/* Reusable lightweight animated backdrop (grid + ambient glow), sits behind content. */
function pwFxMarkup(){
  return '<div class="pw-fx" aria-hidden="true"><div class="pw-fx-grid"></div>'+
    '<div class="pw-fx-glow g1"></div><div class="pw-fx-glow g2"></div><div class="pw-fx-sweep"></div></div>';
}
function siteName(){ try{ return (Repo.settings.get()||{}).websiteName||"Pharm-D with Hyzen"; }catch(e){ return "Pharm-D with Hyzen"; } }
function brandLogoHtml(){ let logo=""; try{ logo=(Repo.settings.get()||{}).logoUrl||""; }catch(e){} return '<div class="wc-logo">'+(logo?'<img src="'+esc(logo)+'" alt="">':HERO_MARK_SVG)+'</div>'; }
function showSplash(){
  // The splash already exists in the initial HTML; never insert a second overlay.
  if(window.__bootClosed)return;
  document.body.classList.add("booting");
}
let __pwWelcomed=true;
function splashDuration(){const n=Number(Repo.settings.get().splashSeconds);return Number.isFinite(n)&&n>=.5&&n<=15?n:2.8;}
function updateSplash(){const d=$('#pwSplash');if(!d||window.__bootClosed)return;const s=Repo.settings.get();d.style.setProperty('--splash-time',splashDuration()+'s');const title=$('#bootTitle');if(title)title.textContent=/^(PharmaWhisper|Pharm-D with whisper)$/i.test(s.websiteName||'')?'Pharm-D with Hyzen':s.websiteName||'Pharm-D with Hyzen';}
function hideSplash(){
 if(window.__bootClosed)return;clearTimeout(window.__bootHideTimer);updateSplash();
 const exitMs=matchMedia('(prefers-reduced-motion: reduce)').matches?100:550;
 const delay=Math.max(0,splashDuration()*1000-exitMs-(Date.now()-(window.__bootStarted||Date.now())));
 window.__bootHideTimer=setTimeout(()=>{if(window.__bootClosed)return;window.__bootClosed=true;document.body.classList.remove('booting');const d=$('#pwSplash');if(d)d.classList.add('exiting');setTimeout(()=>{document.body.classList.remove('booting');d?.remove();SectionChrome.schedule();Notices.receive(Repo.settings.get().fullScreenNotice);Tour.maybe();},exitMs);},delay);
}

// Public welcome overlay — fullscreen blurred grid backdrop + dark-blue card
// showing the admin-set brand logo and name. Auto fade-out ~2s.
function showWelcome(){
  if(__pwWelcomed) return; __pwWelcomed=true;
  if(document.getElementById("pwWelcome")) return;
  const w=document.createElement("div"); w.id="pwWelcome"; w.className="pw-welcome";
  w.innerHTML=pwFxMarkup()+'<div class="pw-welcome-card"><div class="wc-content">'+
    brandLogoHtml()+'<div class="wc-eyebrow">Welcome to</div><h2>'+esc(siteName())+'</h2></div></div>';
  document.body.appendChild(w);
  setTimeout(()=>{ w.classList.add("out"); setTimeout(()=>w.remove(),520); },2000);
}
// Admin welcome overlay — same style, shown right after successful admin login.

    brandLogoHtml()+'<div class="wc-eyebrow">Welcome to</div><h2>Admin Dashboard</h2></div></div>';
  document.body.appendChild(w);

// Fullscreen sign-in loading overlay (blur + gradient + animated lines + dotted loader).
function showSigningOverlay(){
  if(document.getElementById("pwSigning")) return;
  const d=document.createElement("div"); d.id="pwSigning"; d.className="pw-signing";
  d.innerHTML=pwFxMarkup()+'<div class="pw-signing-in"><div class="pw-dots"><span></span><span></span><span></span></div><div class="lbl">Signing In…</div></div>';
  document.body.appendChild(d);
}
function hideSigningOverlay(){ const d=document.getElementById("pwSigning"); if(d){ d.classList.add("out"); setTimeout(()=>d.remove(),360); } }
function showFatal(msg){
  let d=document.getElementById("pwSplash"); if(!d){ showSplash(); d=document.getElementById("pwSplash"); }
  d.classList.remove("gone");
  d.innerHTML='<div class="pw-splash-in" style="max-width:340px;text-align:center"><div class="pw-splash-mark">'+HERO_MARK_SVG+'</div><h2 style="font-size:19px;margin:12px 0 6px">Can\u2019t reach the server</h2><p class="small" style="color:var(--ink-2);line-height:1.6">'+esc(msg)+'</p><button class="btn btn-primary btn-sm" style="margin-top:16px" onclick="location.reload()">Try again</button></div>';
}
function hasCachedContent(){
  try{
    for(const k of ["pw_settings","pw_products","pw_notes_tree","pw_blogs"]){
      const raw=lsOK?localStorage.getItem(k):memStore[k];
      if(raw && raw!=="null" && raw!=="{}" && raw!=="[]") return true;
    }
  }catch(e){}
  return false;
}
(async function boot(){
  showSplash();
  if(SEED_ALLOWED) seed();
  syncRouteTheme(location.hash||"#/");applyThemeAppearance();applyFavicon();
  applySettingsChrome();renderAnnouncement();renderCartBadges();render();
  hideSplash();
  Promise.resolve(Cloud.init()).then(()=>{render();hideSplash();}).catch(()=>{});

})();
})();
